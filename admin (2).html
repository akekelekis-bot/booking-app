<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsRehub — Διαχείριση Ραντεβού</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F5F2EA;
    --cream-2:#EFEBDF;
    --ink:#1A1714;
    --ink-soft:#4A4540;
    --orange:#E07A2C;
    --orange-dark:#C8661D;
    --line:#DDD6C6;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:20px;
  }
  h1{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:4px;
  }
  .sub{color:var(--ink-soft); font-size:13px; margin-bottom:20px;}

  /* LOGIN */
  #login-screen{
    max-width:360px;
    margin:80px auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:28px 24px;
  }
  #login-screen h1{text-align:center; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:11px 13px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:var(--cream);
  }
  button{
    width:100%;
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:3px;
    padding:12px;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  button:hover{background:var(--orange-dark);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  #login-error{
    color:#C0392B;
    font-size:13px;
    margin-top:10px;
    text-align:center;
    display:none;
  }

  /* DASHBOARD */
  #dashboard{display:none; max-width:900px; margin:0 auto;}
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  .logout{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    width:auto;
    padding:8px 16px;
    font-size:11px;
  }
  .logout:hover{background:var(--cream-2); color:var(--ink);}

  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{
    padding:8px 16px;
    border-radius:20px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--white);
  }
  .tab.active{background:var(--ink); color:var(--white); border-color:var(--ink);}

  /* NEW APPOINTMENT FORM */
  .new-appt{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:22px;
  }
  .new-appt h2{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:12px;
  }
  .new-appt .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .new-appt .field{margin-bottom:0;}
  .new-appt .field label{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .new-appt .field input, .new-appt .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px 11px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    background:var(--cream);
  }
  .new-appt .field textarea{resize:vertical; min-height:44px;}
  .new-appt button{margin-top:4px;}
  #new-appt-msg{
    font-size:13px;
    margin-top:10px;
    display:none;
  }
  #new-appt-msg.ok{color:#2E7D32; display:block;}
  #new-appt-msg.err{color:#C0392B; display:block;}


  /* NEW BOOKING FORM */
  .new-booking-box{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:22px;
  }
  .new-booking-box h2{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .nb-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .nb-grid .full{grid-column:1 / -1;}
  .nb-field label{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .nb-field input, .nb-field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px 11px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    background:var(--cream);
  }
  .nb-field textarea{resize:vertical; min-height:44px;}
  .nb-submit{width:auto; padding:9px 18px; font-size:12px;}
  #nb-msg{font-size:12px; margin-top:8px; display:none;}
  #nb-msg.ok{color:#2E7D32;}
  #nb-msg.err{color:#C0392B;}

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .card-info b{display:block; font-size:15px; margin-bottom:2px;}
  .card-info .meta{color:var(--ink-soft); font-size:13px;}
  .card-info .reason{color:var(--ink-soft); font-size:13px; margin-top:4px; font-style:italic;}
  .cancel-btn{
    width:auto;
    background:#FBEAEA;
    color:#8B2E24;
    border:1px solid #E5B4B0;
    padding:8px 14px;
    font-size:11px;
    flex-shrink:0;
  }
  .cancel-btn:hover{background:#F5D5D2;}
  .empty{color:var(--ink-soft); text-align:center; padding:40px 0;}
  .loading{color:var(--ink-soft); text-align:center; padding:40px 0;}

  /* CALENDAR VIEW */
  .cal-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:16px;
  }
  .cal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .cal-head .arrow{
    cursor:pointer;
    color:var(--ink-soft);
    font-size:18px;
    padding:0 8px;
    user-select:none;
  }
  .cal-head .arrow:hover{color:var(--ink);}
  .cal-grid2{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    text-align:center;
  }
  .cal-grid2 .dow{color:var(--ink-soft); font-size:10px; padding-bottom:4px;}
  .cal-grid2 .day{
    padding:8px 0 6px;
    border-radius:4px;
    cursor:default;
    color:var(--ink-soft);
    position:relative;
    min-height:38px;
  }
  .cal-grid2 .day.has-appts{
    cursor:pointer;
    background:var(--cream-2);
    color:var(--ink);
    font-weight:600;
  }
  .cal-grid2 .day.has-appts:hover{background:var(--orange); color:var(--white);}
  .cal-grid2 .day.selected{background:var(--ink); color:var(--white);}
  .cal-grid2 .badge{
    display:block;
    font-size:10px;
    margin-top:2px;
  }
  .cal-day-title{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:15px;
    margin:16px 0 8px;
  }

  /* CAL MODE TOGGLE */
  .cal-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .cal-toggle-btn{
    padding:6px 14px;
    border-radius:16px;
    font-family:'Jost',sans-serif;
    font-size:12px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
  }
  .cal-toggle-btn.active{background:var(--orange); color:var(--white); border-color:var(--orange);}

  /* WEEK VIEW */
  .week-day{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .week-day-head{
    background:var(--cream-2);
    padding:8px 14px;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:13px;
    display:flex;
    justify-content:space-between;
  }
  .week-day-head .count{color:var(--ink-soft); font-weight:500; font-size:12px;}
  .week-day-body{padding:4px 0;}
  .week-day-body .empty-slot{
    color:var(--ink-soft);
    font-size:12px;
    padding:10px 14px;
    font-style:italic;
  }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Διαχείριση Ραντεβού</h1>
  <form id="login-form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div class="field">
      <label>Κωδικός</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <button type="submit" id="login-btn">Σύνδεση</button>
    <div id="login-error">Λάθος στοιχεία σύνδεσης.</div>
  </form>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>Ραντεβού</h1>
    <button class="logout" id="logout-btn">Αποσύνδεση</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-view="upcoming">Επερχόμενα</div>
    <div class="tab" data-view="calendar">Ημερολόγιο</div>
    <div class="tab" data-view="past">Παλαιότερα</div>
  </div>

  <div class="new-appt">
    <h2>+ Νέο Ραντεβού (χειροκίνητα)</h2>
    <form id="new-appt-form">
      <div class="row">
        <div class="field">
          <label>Ημερομηνία</label>
          <input type="date" id="na-date" required>
        </div>
        <div class="field">
          <label>Ώρα</label>
          <input type="time" id="na-time" required>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Ονοματεπώνυμο</label>
          <input type="text" id="na-name" required>
        </div>
        <div class="field">
          <label>Τηλέφωνο</label>
          <input type="tel" id="na-phone" required>
        </div>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label>Αιτιολογία / Σημείωση</label>
        <textarea id="na-reason"></textarea>
      </div>
      <button type="submit" id="na-submit">Καταχώρηση Ραντεβού</button>
      <div id="new-appt-msg"></div>
    </form>
  </div>

  <div id="calendar-view" style="display:none;">
    <div class="cal-toggle">
      <span class="cal-toggle-btn active" data-mode="month">Μήνας</span>
      <span class="cal-toggle-btn" data-mode="week">Εβδομάδα</span>
    </div>

    <div id="month-mode">
      <div class="cal-wrap">
        <div class="cal-head">
          <span class="arrow" id="cal-prev">‹</span>
          <span id="cal-month-label">—</span>
          <span class="arrow" id="cal-next">›</span>
        </div>
        <div class="cal-grid2" id="admin-cal-grid"></div>
      </div>
      <div id="cal-day-title" class="cal-day-title" style="display:none;"></div>
      <div id="cal-day-list"></div>
    </div>

    <div id="week-mode" style="display:none;">
      <div class="cal-head" style="margin-bottom:12px;">
        <span class="arrow" id="week-prev">‹</span>
        <span id="week-range-label">—</span>
        <span class="arrow" id="week-next">›</span>
      </div>
      <div id="week-list"></div>
    </div>
  </div>

  <div id="bookings-list"><div class="loading">Φόρτωση…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://kyhegdwzsqucfpzjxdif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3pUJ6LS6p9l4ycPSzOnClw_rjndX5s4';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('login-screen');
const dashboard = document.getElementById('dashboard');
const bookingsList = document.getElementById('bookings-list');
let currentView = 'upcoming';

// --- AUTH ---
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Σύνδεση…';

  const { error } = await supa.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Σύνδεση';

  if (error) {
    errEl.style.display = 'block';
    return;
  }
  showDashboard();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supa.auth.signOut();
  location.reload();
});

async function checkSession() {
  const { data } = await supa.auth.getSession();
  if (data.session) {
    showDashboard();
  }
}

function showDashboard() {
  loginScreen.style.display = 'none';
  dashboard.style.display = 'block';
  loadBookings();
}

// --- TABS ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;

    document.getElementById('calendar-view').style.display = (currentView === 'calendar') ? 'block' : 'none';
    document.getElementById('bookings-list').style.display = (currentView === 'calendar') ? 'none' : 'block';

    if (currentView === 'calendar') {
      loadCalendarData();
    } else {
      loadBookings();
    }
  });
});

// --- CALENDAR MODE TOGGLE (Month / Week) ---
let calMode = 'month';
document.querySelectorAll('.cal-toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cal-toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    calMode = btn.dataset.mode;
    document.getElementById('month-mode').style.display = (calMode === 'month') ? 'block' : 'none';
    document.getElementById('week-mode').style.display = (calMode === 'week') ? 'block' : 'none';
    if (calMode === 'month') renderMonthCalendar();
    else renderWeekView();
  });
});

// --- SHARED: fetch all upcoming bookings grouped by date ---
let allBookingsByDate = {}; // { 'YYYY-MM-DD': [ {full_name, phone, reason, time, bookingId, slotId} ] }

async function loadCalendarData() {
  const { data, error } = await supa
    .from('bookings')
    .select('id, full_name, phone, reason, availability:slot_id ( id, slot_date, slot_time )')
    .order('created_at', { ascending: true });

  allBookingsByDate = {};
  if (!error && data) {
    data.forEach(b => {
      if (!b.availability) return;
      const key = b.availability.slot_date;
      if (!allBookingsByDate[key]) allBookingsByDate[key] = [];
      allBookingsByDate[key].push({
        bookingId: b.id,
        slotId: b.availability.id,
        time: b.availability.slot_time.slice(0,5),
        name: b.full_name,
        phone: b.phone,
        reason: b.reason
      });
    });
    Object.values(allBookingsByDate).forEach(list => list.sort((a,b) => a.time.localeCompare(b.time)));
  }

  if (calMode === 'month') renderMonthCalendar();
  else renderWeekView();
}

// --- MONTH VIEW ---
let calMonth = new Date();
let selectedCalDate = null;
const DOW = ['Δ','Τ','Τ','Π','Π','Σ','Κ'];
const MONTHS = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

function renderMonthCalendar(){
  const grid = document.getElementById('admin-cal-grid');
  const label = document.getElementById('cal-month-label');
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  label.textContent = `${MONTHS[m]} ${y}`;

  const firstDay = new Date(y, m, 1);
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevMonthDays = new Date(y, m, 0).getDate();

  let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = startOffset; i > 0; i--) {
    html += `<div class="day">${prevMonthDays - i + 1}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const list = allBookingsByDate[key];
    let cls = 'day';
    if (list && list.length) cls += ' has-appts';
    if (key === selectedCalDate) cls += ' selected';
    html += `<div class="${cls}" data-date="${key}">${d}${list && list.length ? `<span class="badge">${list.length}</span>` : ''}</div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.day.has-appts').forEach(el => {
    el.addEventListener('click', () => {
      selectedCalDate = el.getAttribute('data-date');
      renderMonthCalendar();
      renderDayList(selectedCalDate);
    });
  });
}

function renderDayList(dateKeyStr){
  const titleEl = document.getElementById('cal-day-title');
  const listEl = document.getElementById('cal-day-list');
  const list = allBookingsByDate[dateKeyStr] || [];
  const d = new Date(dateKeyStr + 'T00:00:00');
  titleEl.textContent = d.toLocaleDateString('el-GR', { weekday:'long', day:'numeric', month:'long' });
  titleEl.style.display = 'block';

  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">Δεν υπάρχουν ραντεβού αυτή τη μέρα.</div>';
    return;
  }
  listEl.innerHTML = list.map(b => `
    <div class="card">
      <div class="card-info">
        <b>${b.time} — ${escapeHtml(b.name)}</b>
        <div class="meta">${escapeHtml(b.phone)}</div>
        ${b.reason ? `<div class="reason">${escapeHtml(b.reason)}</div>` : ''}
      </div>
      <button class="cancel-btn" onclick="cancelBookingFromCalendar('${b.bookingId}','${b.slotId}','${dateKeyStr}')">Ακύρωση</button>
    </div>
  `).join('');
}

async function cancelBookingFromCalendar(bookingId, slotId, dateKeyStr) {
  if (!confirm('Σίγουρα θέλεις να ακυρώσεις αυτό το ραντεβού;')) return;
  await supa.from('bookings').delete().eq('id', bookingId);
  await supa.from('availability').update({ is_booked: false }).eq('id', slotId);
  await loadCalendarData();
  if (calMode === 'month') renderDayList(dateKeyStr);
}

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
  renderMonthCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
  renderMonthCalendar();
});

// --- WEEK VIEW ---
let weekAnchor = new Date(); // any date within the displayed week

function getWeekStart(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // Monday = 0
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}

function renderWeekView(){
  const start = getWeekStart(weekAnchor);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }
  const label = document.getElementById('week-range-label');
  const fmt = (d) => d.toLocaleDateString('el-GR', { day:'numeric', month:'short' });
  label.textContent = `${fmt(days[0])} – ${fmt(days[6])}`;

  const container = document.getElementById('week-list');
  container.innerHTML = days.map(d => {
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const list = allBookingsByDate[key] || [];
    const dayLabel = d.toLocaleDateString('el-GR', { weekday:'long', day:'numeric', month:'short' });
    const bodyHtml = list.length === 0
      ? '<div class="empty-slot">Δεν υπάρχουν ραντεβού</div>'
      : list.map(b => `
          <div class="card" style="margin:6px 10px; border-radius:4px;">
            <div class="card-info">
              <b>${b.time} — ${escapeHtml(b.name)}</b>
              <div class="meta">${escapeHtml(b.phone)}</div>
              ${b.reason ? `<div class="reason">${escapeHtml(b.reason)}</div>` : ''}
            </div>
            <button class="cancel-btn" onclick="cancelBookingFromCalendar('${b.bookingId}','${b.slotId}','${key}')">Ακύρωση</button>
          </div>
        `).join('');
    return `
      <div class="week-day">
        <div class="week-day-head">
          <span>${dayLabel}</span>
          <span class="count">${list.length ? list.length + ' ραντεβού' : ''}</span>
        </div>
        <div class="week-day-body">${bodyHtml}</div>
      </div>
    `;
  }).join('');
}

document.getElementById('week-prev').addEventListener('click', () => {
  weekAnchor = new Date(weekAnchor.getTime() - 7*24*60*60*1000);
  renderWeekView();
});
document.getElementById('week-next').addEventListener('click', () => {
  weekAnchor = new Date(weekAnchor.getTime() + 7*24*60*60*1000);
  renderWeekView();
});

// --- LOAD BOOKINGS ---
async function loadBookings() {
  bookingsList.innerHTML = '<div class="loading">Φόρτωση…</div>';

  const { data, error } = await supa
    .from('bookings')
    .select('id, full_name, phone, reason, created_at, availability:slot_id ( id, slot_date, slot_time )')
    .order('created_at', { ascending: false });

  if (error) {
    bookingsList.innerHTML = '<div class="empty">Σφάλμα φόρτωσης. Δοκίμασε ανανέωση.</div>';
    console.error(error);
    return;
  }

  const todayStr = new Date().toISOString().slice(0,10);
  let filtered = (data || []).filter(b => b.availability);

  if (currentView === 'upcoming') {
    filtered = filtered.filter(b => b.availability.slot_date >= todayStr);
    filtered.sort((a,b) => (a.availability.slot_date + a.availability.slot_time).localeCompare(b.availability.slot_date + b.availability.slot_time));
  } else {
    filtered = filtered.filter(b => b.availability.slot_date < todayStr);
    filtered.sort((a,b) => (b.availability.slot_date + b.availability.slot_time).localeCompare(a.availability.slot_date + a.availability.slot_time));
  }

  if (filtered.length === 0) {
    bookingsList.innerHTML = '<div class="empty">Δεν υπάρχουν ραντεβού.</div>';
    return;
  }

  bookingsList.innerHTML = filtered.map(b => {
    const d = new Date(b.availability.slot_date + 'T00:00:00');
    const dateLabel = d.toLocaleDateString('el-GR', { weekday:'short', day:'numeric', month:'short' });
    const time = b.availability.slot_time.slice(0,5);
    return `
      <div class="card" data-booking-id="${b.id}" data-slot-id="${b.availability.id}">
        <div class="card-info">
          <b>${escapeHtml(b.full_name)}</b>
          <div class="meta">${dateLabel} · ${time} · ${escapeHtml(b.phone)}</div>
          ${b.reason ? `<div class="reason">${escapeHtml(b.reason)}</div>` : ''}
        </div>
        ${currentView === 'upcoming' ? `<button class="cancel-btn" onclick="cancelBooking('${b.id}','${b.availability.id}')">Ακύρωση</button>` : ''}
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- CANCEL BOOKING ---
async function cancelBooking(bookingId, slotId) {
  if (!confirm('Σίγουρα θέλεις να ακυρώσεις αυτό το ραντεβού; Η ώρα θα ξαναγίνει διαθέσιμη.')) return;

  const { error: delErr } = await supa.from('bookings').delete().eq('id', bookingId);
  if (delErr) { alert('Σφάλμα κατά την ακύρωση.'); console.error(delErr); return; }

  const { error: updErr } = await supa.from('availability').update({ is_booked: false }).eq('id', slotId);
  if (updErr) { console.error(updErr); }

  loadBookings();
}

checkSession();

// --- NEW APPOINTMENT (manual) ---
document.getElementById('new-appt-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const date = document.getElementById('na-date').value;
  const time = document.getElementById('na-time').value; // HH:MM
  const name = document.getElementById('na-name').value.trim();
  const phone = document.getElementById('na-phone').value.trim();
  const reason = document.getElementById('na-reason').value.trim();
  const btn = document.getElementById('na-submit');
  const msg = document.getElementById('new-appt-msg');
  msg.className = ''; msg.style.display = 'none';

  if (!date || !time || !name || !phone) {
    msg.textContent = 'Συμπλήρωσε όλα τα υποχρεωτικά πεδία.';
    msg.className = 'err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Καταχώρηση…';

  try {
    // Try to find an existing (unbooked) slot for this date/time first
    const { data: existingSlot } = await supa
      .from('availability')
      .select('id, is_booked')
      .eq('slot_date', date)
      .eq('slot_time', time + ':00')
      .maybeSingle();

    let slotId;

    if (existingSlot) {
      if (existingSlot.is_booked) {
        msg.textContent = 'Αυτή η ώρα είναι ήδη κλεισμένη.';
        msg.className = 'err';
        btn.disabled = false;
        btn.textContent = 'Καταχώρηση Ραντεβού';
        return;
      }
      const { error: updErr } = await supa
        .from('availability')
        .update({ is_booked: true })
        .eq('id', existingSlot.id);
      if (updErr) throw updErr;
      slotId = existingSlot.id;
    } else {
      // Create a new slot (e.g. Saturday, or outside normal hours) and mark it booked
      const { data: newSlot, error: insErr } = await supa
        .from('availability')
        .insert({ slot_date: date, slot_time: time + ':00', is_booked: true })
        .select()
        .single();
      if (insErr) throw insErr;
      slotId = newSlot.id;
    }

    const { error: bookErr } = await supa
      .from('bookings')
      .insert({ slot_id: slotId, full_name: name, phone: phone, reason: reason, language: 'el' });
    if (bookErr) throw bookErr;

    msg.textContent = 'Το ραντεβού καταχωρήθηκε!';
    msg.className = 'ok';
    document.getElementById('new-appt-form').reset();
    loadBookings();

  } catch (err) {
    console.error(err);
    msg.textContent = 'Κάτι πήγε στραβά. Δοκίμασε ξανά.';
    msg.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Καταχώρηση Ραντεβού';
  }
});

</script>
