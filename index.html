<script>
/* ===== Sports ReHub Load Log — cloud sync (Supabase) ===== */
(function () {
  var SB_URL = 'https://vucnlrzsggoxwwwydgsj.supabase.co';
  var SB_KEY = 'sb_publishable_KI0_YFg0s_bm2vjWQHXO1A_KNqCoja8';
  var PFX = 'trl_', META = 'll_meta', OUT = 'll_outbox', FLAG = 'll_loggedin';
  var sb = null, user = null, pollTimer = null, flushTimer = null, flushing = false, stale = false;
  var fresh = {}, lastAct = Date.now();
  ['keydown', 'pointerdown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
  function lsGet(k, f) { try { var v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var meta = lsGet(META, {}), outbox = lsGet(OUT, []);
  function saveMeta() { lsSet(META, meta); }
  function saveOut() { lsSet(OUT, outbox); }
  function eq(a, b) { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } }

  /* ---------- tiny UI ---------- */
  var css = document.createElement('style');
  css.textContent =
    '.ll-pill{position:fixed;left:10px;bottom:10px;z-index:9999;display:flex;gap:8px;align-items:center;background:rgba(10,10,10,.92);color:#F2F2F2;border:1px solid #DADAD6;border-radius:999px;padding:6px 12px;font:500 12px "IBM Plex Sans",system-ui,sans-serif}' +
    '.ll-pill button{background:none;border:none;color:#D9560B;font:inherit;cursor:pointer;text-decoration:underline;padding:0}' +
    '.ll-dot{width:8px;height:8px;border-radius:50%;background:#888}.ll-ok .ll-dot{background:#6FBF73}.ll-busy .ll-dot{background:#D9560B}.ll-off .ll-dot{background:#D9822B}.ll-err .ll-dot{background:#D95C4A}' +
    '.ll-banner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9999;background:#D9560B;color:#FFFFFF;border-radius:999px;padding:9px 18px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;display:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}' +
    '.ll-login{position:fixed;inset:0;z-index:10000;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"IBM Plex Sans",system-ui,sans-serif}' +
    '.ll-login form{width:100%;max-width:340px;background:#FFFFFF;border:1px solid #DADAD6;border-radius:18px;padding:26px;color:#111111}' +
    '.ll-login h1{margin:0 0 4px;font:600 20px "Space Grotesk",system-ui,sans-serif}.ll-login p{margin:0 0 18px;color:#9A9A9A;font-size:13px}' +
    '.ll-login input{width:100%;margin:0 0 10px;padding:11px 14px;border-radius:999px;border:1px solid #DADAD6;background:#FFFFFF;color:#111;font:inherit;font-size:15px}' +
    '.ll-login button{width:100%;padding:12px;border:none;border-radius:999px;background:#D9560B;color:#FFFFFF;font:600 15px inherit;cursor:pointer}' +
    '.ll-err-t{color:#C0392B;font-size:13px;min-height:18px;margin-bottom:8px}' +
    '@media print{.ll-pill,.ll-banner,.ll-login{display:none!important}}';
  document.head.appendChild(css);
  var pill = document.createElement('div'); pill.className = 'll-pill ll-busy'; pill.style.display = 'none';
  pill.innerHTML = '<span class="ll-dot"></span><span class="ll-txt">…</span><button type="button" class="ll-out" style="display:none">Αποσύνδεση</button>';
  var banner = document.createElement('div'); banner.className = 'll-banner'; banner.textContent = 'Νεότερα δεδομένα από άλλη συσκευή — πάτησε για ανανέωση';
  banner.onclick = function () { location.reload(); };
  function mount() { document.body.appendChild(pill); document.body.appendChild(banner); }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
  function setStatus(kind, text) {
    pill.style.display = 'flex'; pill.className = 'll-pill ll-' + kind;
    pill.querySelector('.ll-txt').textContent = text;
    pill.querySelector('.ll-out').style.display = user ? '' : 'none';
  }
  pill.querySelector('.ll-txt').style.cursor = 'pointer';
  pill.querySelector('.ll-txt').title = 'Πάτησε για ένωση δεδομένων με τις άλλες συσκευές';
  pill.querySelector('.ll-txt').onclick = async function () {
    if (!sb || !user) { alert('Πρώτα συνδέσου για συγχρονισμό.'); return; }
    if (!confirm('Ένωση δεδομένων: θα προστεθούν σε αυτή τη συσκευή οι ασθενείς και οι εγγραφές που λείπουν από την άλλη συσκευή και αντίστροφα. Δεν διαγράφεται τίποτα. Συνέχεια;')) return;
    try {
      setStatus('busy', 'Ένωση δεδομένων…');
      var r = await sb.from('loadlog_shared').select('key,value');
      if (r.error) throw r.error;
      var cloud = {}; (r.data || []).forEach(function (row) { cloud[row.key] = row.value; });
      var keys = {}; Object.keys(cloud).forEach(function (k) { keys[k] = 1; }); localKeys().forEach(function (k) { keys[k] = 1; });
      var n = 0;
      for (var k in keys) {
        var has = localStorage.getItem(k) != null, l = has ? lsGet(k, null) : null, c = cloud[k];
        var m = (has && c !== undefined) ? mergeFirst(l, c, k) : (has ? l : c);
        if (m === undefined || m === null) continue;
        if (!eq(m, l) || !eq(m, c)) n++;
        lsSet(k, m); await pushNow(k, m);
      }
      setStatus('ok', 'Συγχρονισμένο');
      alert('Ολοκληρώθηκε. Ενημερώθηκαν ' + n + ' στοιχεία. Η σελίδα θα ξαναφορτώσει.');
      location.reload();
    } catch (e) { console.error(e); setStatus('err', 'Σφάλμα συγχρονισμού'); alert('Η ένωση δεν ολοκληρώθηκε. Δοκίμασε ξανά.'); }
  };
  pill.querySelector('.ll-out').onclick = async function () {
    if (outbox.length && !confirm('Υπάρχουν αλλαγές που δεν έχουν συγχρονιστεί. Αποσύνδεση ούτως ή άλλως;')) return;
    try { await sb.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem(FLAG); } catch (e) {}
    location.reload();
  };

  function showLogin() {
    return new Promise(function (resolve) {
      var w = document.createElement('div'); w.className = 'll-login';
      w.innerHTML = '<form><h1>SportsRehub Medical</h1><p>Σύνδεση για συγχρονισμό μεταξύ συσκευών.</p>' +
        '<input type="email" id="ll-e" placeholder="Email" autocomplete="username" required>' +
        '<input type="password" id="ll-p" placeholder="Κωδικός" autocomplete="current-password" required>' +
        '<div class="ll-err-t" id="ll-t"></div><button type="submit">Σύνδεση</button></form>';
      (document.body ? Promise.resolve() : new Promise(function (r) { document.addEventListener('DOMContentLoaded', r); })).then(function () {
        document.body.appendChild(w);
        w.querySelector('form').onsubmit = async function (ev) {
          ev.preventDefault();
          var b = w.querySelector('button'); b.disabled = true; b.textContent = 'Σύνδεση…';
          var r = await sb.auth.signInWithPassword({ email: w.querySelector('#ll-e').value.trim(), password: w.querySelector('#ll-p').value });
          if (r.error || !r.data || !r.data.session) { var m = r.error ? String(r.error.message || r.error) : 'Άγνωστο σφάλμα'; w.querySelector('#ll-t').textContent = /confirm/i.test(m) ? 'Το email δεν έχει επιβεβαιωθεί στο Supabase (Auto Confirm).' : /invalid login/i.test(m) ? 'Λάθος email ή κωδικός (ή ο χρήστης δεν υπάρχει σε αυτό το project).' : 'Σφάλμα: ' + m; b.disabled = false; b.textContent = 'Σύνδεση'; return; }
          w.remove(); resolve(r.data.session);
        };
      });
    });
  }

  /* ---------- sync core ---------- */
  function localKeys() { var ks = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(PFX) === 0) ks.push(k); } return ks; }
  async function pushNow(key, val) {
    var r = await sb.from('loadlog_shared').upsert({ key: key, value: val }, { onConflict: 'key' }).select('updated_at').single();
    if (r.error) throw r.error;
    meta[key] = r.data.updated_at; saveMeta();
  }
  async function delNow(key) {
    var r = await sb.from('loadlog_shared').delete().eq('key', key);
    if (r.error) throw r.error;
    delete meta[key]; saveMeta();
  }
  async function flush() {
    if (!sb || !user || flushing || !outbox.length) return;
    flushing = true; setStatus('busy', 'Συγχρονισμός…');
    try {
      var keys = outbox.slice();
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], raw = localStorage.getItem(k);
        if (raw == null) await delNow(k); else await pushNow(k, JSON.parse(raw));
        outbox = outbox.filter(function (x) { return x !== k; }); saveOut();
      }
      setStatus('ok', 'Συγχρονισμένο');
    } catch (e) {
      console.error('sync', e);
      setStatus(navigator.onLine ? 'err' : 'off', navigator.onLine ? 'Σφάλμα συγχρονισμού' : 'Εκτός σύνδεσης — θα συγχρονιστεί');
    } finally { flushing = false; }
  }
  function queue(key) {
    if (key.indexOf(PFX) !== 0) return;
    if (outbox.indexOf(key) < 0) { outbox.push(key); saveOut(); }
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700);
    if (user) setStatus('busy', 'Αποθήκευση…');
  }
  function mergeFirst(l, c, key) {
    try { localStorage.setItem('ll_backup_' + key, JSON.stringify(l)); } catch (e) {}
    var arr = Array.isArray(l) && Array.isArray(c);
    if (arr && l.concat(c).every(function (x) { return x && typeof x === 'object' && x.id != null; })) {
      var seen = {}, out = [];
      c.forEach(function (x) { seen[x.id] = 1; out.push(x); });
      l.forEach(function (x) { if (!seen[x.id]) out.push(x); });
      if (key.indexOf('trl_patients') !== 0 && out.every(function (x) { return /^\d+$/.test(String(x.id)); })) out.sort(function (a, b) { return Number(b.id) - Number(a.id); });
      return out;
    }
    if (!arr && l && c && typeof l === 'object' && typeof c === 'object' && !Array.isArray(l) && !Array.isArray(c)) return Object.assign({}, l, c);
    return c;
  }
  async function initialSync() {
    setStatus('busy', 'Συγχρονισμός…');
    var r = await sb.from('loadlog_shared').select('key,value,updated_at');
    if (r.error) {
      var missing = /relation|does not exist|schema cache|loadlog_shared/i.test(r.error.message || '');
      setStatus('err', missing ? 'Λείπει ο πίνακας στο Supabase' : 'Σφάλμα συγχρονισμού');
      if (missing) alert('Ο συγχρονισμός δεν είναι έτοιμος: τρέξε το loadlog-shared.sql στο Supabase (SQL Editor). Η εφαρμογή δουλεύει προς το παρόν μόνο τοπικά.');
      user = null; return;
    }
    var cloud = {}; (r.data || []).forEach(function (row) { cloud[row.key] = row; });
    var keys = {}; Object.keys(cloud).forEach(function (k) { keys[k] = 1; }); localKeys().forEach(function (k) { keys[k] = 1; });
    var ks = Object.keys(keys);
    for (var i = 0; i < ks.length; i++) {
      var key = ks[i], c = cloud[key], has = localStorage.getItem(key) != null, l = has ? lsGet(key, null) : null;
      if (!c) { if (has) { try { await pushNow(key, l); } catch (e) { if (outbox.indexOf(key) < 0) outbox.push(key); } } continue; }
      if (!has) { if (outbox.indexOf(key) >= 0) { /* deleted locally while offline */ continue; } lsSet(key, c.value); meta[key] = c.updated_at; continue; }
      if (eq(l, c.value)) { meta[key] = c.updated_at; continue; }
      if (outbox.indexOf(key) >= 0) continue;                 /* local newer, will be pushed by flush */
      if (meta[key]) { if (c.updated_at > meta[key]) { lsSet(key, c.value); meta[key] = c.updated_at; } else { await pushNow(key, l); } continue; }
      var m = mergeFirst(l, c.value, key); lsSet(key, m); await pushNow(key, m);
    }
    saveMeta(); saveOut();
    await flush();
  }
  async function poll() {
    if (!sb || !user || document.hidden) return;
    try {
      var r = await sb.from('loadlog_shared').select('key,updated_at');
      if (r.error) return;
      var cloud = {}; (r.data || []).forEach(function (x) { cloud[x.key] = x.updated_at; });
      var changed = false;
      Object.keys(cloud).forEach(function (k) { if (outbox.indexOf(k) < 0 && (!meta[k] || cloud[k] > meta[k])) changed = true; });
      Object.keys(meta).forEach(function (k) { if (!(k in cloud) && outbox.indexOf(k) < 0) changed = true; });
      if (changed) {
        var full = await sb.from('loadlog_shared').select('key,value,updated_at');
        if (!full.error) {
          (full.data || []).forEach(function (row) { if (outbox.indexOf(row.key) < 0 && (!meta[row.key] || row.updated_at > meta[row.key])) { if (!eq(lsGet(row.key, null), row.value)) { lsSet(row.key, row.value); fresh[row.key] = 1; stale = true; } meta[row.key] = row.updated_at; } });
          Object.keys(meta).forEach(function (k) { if (!(k in cloud) && outbox.indexOf(k) < 0) { try { localStorage.removeItem(k); } catch (e) {} delete meta[k]; fresh[k] = 1; stale = true; } });
          saveMeta();
          if (stale) banner.style.display = 'block';
        }
      }
      if (!outbox.length) setStatus('ok', 'Συγχρονισμένο');
    } catch (e) { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); }
  }
  function background() {
    window.addEventListener('online', function () { flush(); poll(); });
    window.addEventListener('offline', function () { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { flush(); poll(); } });
    pollTimer = setInterval(function () { flush(); poll(); }, 30000);
    setInterval(function () { var ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.value; if (stale && !outbox.length && !flushing && !typing && Date.now() - lastAct > 25000) location.reload(); }, 8000);
    window.addEventListener('beforeunload', function () { if (outbox.length) flush(); });
  }

  window.llSync = {
    fresh: function (key) { return !!fresh[key]; },
    reloadSoon: function () { setTimeout(async function () { try { await flush(); } catch (e) {} location.reload(); }, 1200); },
    push: function (key) { queue(key); },
    del: function (key) { queue(key); },
    ready: (async function () {
      try {
        if (!window.supabase) { setStatus('off', 'Μόνο τοπικά (χωρίς σύνδεση)'); return; }
        sb = window.supabase.createClient(SB_URL, SB_KEY);
        var session = null;
        try { var g = await sb.auth.getSession(); session = g && g.data && g.data.session; } catch (e) {}
        if (!session) {
          if (!navigator.onLine && localStorage.getItem(FLAG)) { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); return; }
          session = await showLogin();
        }
        user = session.user; try { localStorage.setItem(FLAG, '1'); } catch (e) {}
        await initialSync();
        if (user) background();
      } catch (e) { console.error(e); setStatus('off', 'Μόνο τοπικά'); }
    })()
  };
})();
</script>

const pnum = (v) => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; };
const symOf = (L, R, aff) => {
  const l = pnum(L), r = pnum(R);
  if (l === null || r === null || l <= 0 || r <= 0) return null;
  if (aff === "Δεξί") return Math.round((r / l) * 100);
  if (aff === "Αριστερό") return Math.round((l / r) * 100);
  return Math.round((Math.min(l, r) / Math.max(l, r)) * 100);
};
const srKey = (x) => [x.joint, x.move, x.method || x.type].join("|");
const baselineOf = (as) => { const ds = Object.keys(as || {}).sort(); return ds.find((d) => as[d] && as[d].baseline) || ds[0] || null; };
function AssessProgress({ assessments, draft, sessionDate }) {
  const [kind, setKind] = useState("strength");
  const [pick, setPick] = useState("");
  const [show, setShow] = useState({ L: true, R: true, S: false });
  const all = { ...(assessments || {}) }; all[sessionDate] = { ...(all[sessionDate] || {}), strength: draft.strength || [], rom: draft.rom || [] };
  const dates = Object.keys(all).filter((d) => (all[d][kind] || []).length).sort();
  const keys = []; const meta = {};
  dates.forEach((d) => (all[d][kind] || []).forEach((r) => { const k = srKey(r); if (!meta[k]) { meta[k] = r; keys.push(k); } }));
  const cur = keys.includes(pick) ? pick : keys[0];
  const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
  const rows = cur ? dates.map((d) => { const h = (all[d][kind] || []).find((x) => srKey(x) === cur); const L = h ? num(h.L) : null, R = h ? num(h.R) : null; return { date: d, L, R, S: L !== null && R !== null && Math.max(L, R) > 0 ? Math.round((Math.min(L, R) / Math.max(L, R)) * 100) : null }; }).filter((r) => r.L !== null || r.R !== null) : [];
  const unit = cur ? (kind === "strength" ? meta[cur].unit : "°") : "";
  const series = [show.L && { key: "L", color: "#2F6FB5", label: "Αριστερά" }, show.R && { key: "R", color: "#C0392B", label: "Δεξιά" }, show.S && { key: "S", color: "#6B8E4E", label: "Συμμετρία %" }].filter(Boolean);
  const vals = rows.flatMap((r) => series.map((s2) => r[s2.key])).filter((v) => v !== null && v !== undefined);
  const chip = (on) => ({ padding: "4px 12px", borderRadius: 999, border: `1px solid ${on ? T.gold : T.panelLine}`, background: on ? "color-mix(in srgb, var(--vac, #D9560B) 14%, transparent)" : "transparent", color: on ? T.gold : T.paperDim, fontSize: 12.5, fontWeight: 600, cursor: "pointer" });
  const th2 = { padding: "3px 6px", fontWeight: 600 };
  return (
    <Panel title="Πρόοδος μετρήσεων">
      <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        <button type="button" onClick={() => setKind("strength")} style={chip(kind === "strength")}>Δύναμη</button>
        <button type="button" onClick={() => setKind("rom")} style={chip(kind === "rom")}>ROM</button>
      </div>
      {keys.length === 0 ? <div style={{ fontSize: 12.5, color: T.paperDim }}>Πρόσθεσε μετρήσεις {kind === "strength" ? "δύναμης" : "ROM"} για να δεις το διάγραμμα.</div> : (
        <>
          <select value={cur} onChange={(e) => setPick(e.target.value)} style={{ ...inputStyle, padding: "6px 10px", fontSize: 13, marginBottom: 8 }}>
            {keys.map((k) => <option key={k} value={k}>{meta[k].joint} · {meta[k].move}{kind === "strength" && meta[k].method ? ` (${meta[k].method.split(" ")[0]})` : ""}</option>)}
          </select>
          <div style={{ display: "flex", gap: 6, marginBottom: 6, flexWrap: "wrap" }}>
            {[["L", "Αριστερά"], ["R", "Δεξιά"], ["S", "Συμμετρία %"]].map(([k, lb]) => <button key={k} type="button" onClick={() => setShow((o) => ({ ...o, [k]: !o[k] }))} style={chip(show[k])}>{lb}</button>)}
          </div>
          {rows.length > 1 && series.length > 0 ? (
            <TrendChart data={rows} xKey="date" domain={(() => { const mn = Math.min(...vals), mx = Math.max(...vals); const pad = Math.max((mx - mn) * 0.25, mx * 0.05, 1); return [Math.max(0, Math.floor(mn - pad)), Math.ceil(mx + pad)]; })()} series={series} />
          ) : (
            <div style={{ fontSize: 12.5, color: T.paperDim, margin: "6px 0" }}>Χρειάζονται τουλάχιστον 2 αξιολογήσεις με αυτή τη μέτρηση για διάγραμμα.</div>
          )}
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, marginTop: 4 }}>
              <thead><tr style={{ color: T.paperDim, textAlign: "left" }}><th style={th2}>Ημ/νία</th><th style={th2}>Α</th><th style={th2}>Δ</th><th style={th2}>Συμμ.</th></tr></thead>
              <tbody>{rows.map((r) => <tr key={r.date} style={{ borderTop: `1px solid ${T.panelLine}` }}><td style={{ padding: "3px 6px" }}>{fmtDay(r.date)}</td><td style={{ padding: "3px 6px" }}>{r.L ?? "—"} {unit}</td><td style={{ padding: "3px 6px" }}>{r.R ?? "—"} {unit}</td><td style={{ padding: "3px 6px" }}>{r.S !== null ? r.S + "%" : "—"}</td></tr>)}</tbody>
            </table>
          </div>
        </>
      )}
    </Panel>
  );
}

function StrengthRomPanel({ draft, ad, assessments, sessionDate, affected }) {
  const [kind, setKind] = useState("strength");
  const blank = { joint: "Γόνατο", move: "Έκταση", method: "Δυναμόμετρο χειρός (HHD)", type: "Ενεργητικό", unit: "N", L: "", R: "", rpe: "—", pain: "—", endfeel: "—", note: "" };
  const [f, setF] = useState(blank);
  const set = (k, v) => setF((o) => ({ ...o, [k]: v }));
  const list = draft[kind] || [];
  const isStr = kind === "strength";
  const add = () => {
    if (String(f.L).trim() === "" && String(f.R).trim() === "") return;
    const row = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), joint: f.joint, move: f.move, L: f.L, R: f.R, rpe: f.rpe, pain: f.pain, note: f.note };
    if (isStr) { row.method = f.method; row.unit = f.unit; } else { row.type = f.type; row.endfeel = f.endfeel; }
    ad(kind, [...list, row]);
    setF((o) => ({ ...o, L: "", R: "", note: "", rpe: "—", pain: "—", endfeel: "—" }));
  };
  const prevOf = (row) => {
    const dates = Object.keys(assessments || {}).filter((d) => d < sessionDate).sort().reverse();
    for (const d of dates) { const hit = ((assessments[d] || {})[kind] || []).find((x) => srKey(x) === srKey(row)); if (hit) return { d, row: hit }; }
    return null;
  };
  const baseOf = (row) => {
    const bd = baselineOf(assessments); if (!bd || bd === sessionDate || bd > sessionDate) return null;
    const hit = ((assessments[bd] || {})[kind] || []).find((x) => srKey(x) === srKey(row)); return hit ? { d: bd, row: hit } : null;
  };
  const delta = (cur, prev) => { const c = pnum(cur), p = pnum(prev); if (c === null || p === null || p === 0) return null; const pc = Math.round(((c - p) / Math.abs(p)) * 1000) / 10; return pc; };
  const chipStyle = (on) => ({ padding: "8px 18px", borderRadius: 999, border: `1px solid ${on ? T.gold : T.panelLine}`, background: on ? "color-mix(in srgb, var(--vac, #D9560B) 14%, transparent)" : "transparent", color: on ? T.gold : T.paperDim, fontSize: 13, fontWeight: 600, cursor: "pointer" });
  const numUnit = isStr ? f.unit : "°";
  return (
    <Panel title="Αξιολόγηση Δύναμης & ROM">
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button type="button" onClick={() => setKind("strength")} style={chipStyle(isStr)}>Δύναμη ({(draft.strength || []).length})</button>
        <button type="button" onClick={() => setKind("rom")} style={chipStyle(!isStr)}>ROM ({(draft.rom || []).length})</button>
      </div>

ναμενόμενοι μηχανισμοί δύναμη, αντοχή, αυτοαποτελεσματικότητα πόνου και μείωση φόβου κίνησης — εκπαίδευση και αυτοπεποίθηση είναι μέρος της δόσης. Στην αξιολόγηση μπαίνουν και τρόπος ζωής/κοινωνικοί προσδιοριστές (ύπνος, φυσική δραστηριότητα, διατροφή, στρες) — συν-απόφαση. Ρίπτες: Ισχυρή τεκμηρίωση μόνο για προπόνηση με ελεύθερα βάρη (barbell, σύνθετες ασκήσεις, π.χ. bench press/pull-over, συνήθως 2×/εβδ., 4–10 εβδ.) για ταχύτητα ρίψης· ελαστικά/medicine ball/core δεν έδειξαν σαφές όφελος ή έχουν λίγα δεδομένα· ανεπαρκής τεκμηρίωση για απόσταση, και medicine ball/ελαστικά δεν βελτίωσαν ακρίβεια. Παγωμένος ώμος (Delphi 14 ειδικών — γνώμη, όχι αποδείξεις): θεραπεία ανά φάση — πρώιμη (πόνος>δυσκαμψία): ενημέρωση, καθησυχασμός, ενδοαρθρική κορτικοστεροειδής· όχι μασάζ, ακινητοποίηση, κρύο/θερμότητα, ηλεκτροθεραπεία, υπέρηχος· όψιμη (δυσκαμψία>πόνος): χειρισμοί/κινητοποιήσεις, υδροδιαστολή, χειρουργείο, εκπαίδευση· πρόγραμμα ασκήσεων στο σπίτι και αποκλεισμός σοβαρής παθολογίας βοηθούν· δεν υποχωρεί πλήρως χωρίς θεραπεία. Παράγοντες: διαβήτης, θυρεοειδής, τραύμα/χειρουργείο, ακινητοποίηση· ψυχοκοινωνικά: φόβος-αποφυγή, κατάθλιψη/άγχος, αυτοαποτελεσματικότητα. VR (focus groups φυσικοθεραπευτών): ενδιαφέρον ως εργαλείο αποκατάστασης ώμου, ποιοτικά δεδομένα χωρίς αποτελέσματα αποτελεσματικότητας. Ειδικά τεστ ώμου — υπάρχουν >70 τεστ αλλά κανένα δεν απομονώνει δομή (στο empty can ενεργοποιούνται 9 μύες, στο full can 8)· τα ευρήματα απεικόνισης (πάχυνση θυλάκου, οστεόφυτα, εκφύλιση/ρήξεις πετάλου, αλλοιώσεις ΑΚ) υπάρχουν και σε ασυμπτωματικούς, άρα το «χρυσό πρότυπο» δεν είναι χρυσό. Πρακτικά: αν τα χρησιμοποιείς, ερμήνευσέ τα μόνο ως αναπαραγωγή συμπτωμάτων, όχι ως απόδειξη δομής· έμφαση σε ιστορικό (αλλαγή φορτίου, πεποιθήσεις, ψυχοκοινωνικά, τρόπος ζωής), red flags και συνολική εικόνα. Το «RCRSP» προτιμήθηκε από κλινικούς έναντι «μη ειδικού πόνου ώμου»· οι ετικέτες τενοντοπάθεια/τενόντωση/θυλακίτιδα δεν είναι επαληθεύσιμες και η υποακρωμιακή πρόσκρουση δεν στηρίζεται (η ακρωμιοπλαστική δεν ξεπερνά placebo χειρουργείο)· ψευδείς διαγνώσεις έχουν κόστος (φόβος, αποφυγή κίνησης). Κύριος παράγοντας η υπερβολική (σχετική) φόρτιση· ταξινόμηση ΕΡΕΘΙΣΤΙΚΗ vs ΜΗ ΕΡΕΘΙΣΤΙΚΗ — ερεθιστική (σταθερός/νυχτερινός/παρατεινόμενος πόνος): σχετική ανάπαυση, αργές ασκήσεις με στήριξη του βραχίονα και μειωμένο εύρος, ισομετρικές προς την κατεύθυνση του πόνου, έγχυση μόνο αν δεν βοηθούν· μη ερεθιστική: σταδιακή επαναφόρτιση από απλές σε σύνθετες κινήσεις, χωρίς ανεξέλεγκτη επιδείνωση, με τη «διαδικασία τροποποίησης συμπτωμάτων» (αλλαγή θέσης/ωμοπλάτης/στάσης). Ισοδύναμα αποτελέσματα με χειρουργείο σε μελέτες. Αν υπάρχει υψηλός ανεξήγητος πόνος ηρεμίας, αποκλείονται σοβαρές παθολογίες. Δοκιμές δύναμης — δεν υπάρχει συναινετική τεχνική (MMT υποκειμενικό, HHD πολύ μεταβλητό, ισοκινητικό μη πρακτικό)· η μέγιστη ισομετρική δύναμη σε απομόνωση έχει μικρή αξία απόφασης στο RCRSP και δεν είναι σαφές αν η αδυναμία είναι αιτία ή συνέπεια· πιο χρήσιμα: επαναλήψεις μέχρι πόνο/κόπωση, παραγωγή δύναμης χωρίς πόνο, λειτουργικά τεστ στόχου (π.χ. ανύψωση 10 kg από το δάπεδο σε ύψος ντουλαπιού) — ταυτίζονται με τον στόχο της άσκησης.",
  "Ποδοκνημική / πόδι": "Τα περισσότερα τεστ αστραγάλου έχουν περιορισμένη τεκμηρίωση — ευρήματα ιστορικού + ψηλάφηση + σύγκριση με την υγιή πλευρά. Πρώιμη κινητοποίηση και νευρομυϊκή εκπαίδευση από την πρώτη εβδομάδα μειώνουν υποτροπές· η ΑΙΤFL (high ankle) χρειάζεται μεγαλύτερο χρόνο επιστροφής· ROAST: ελάχιστη διαγνωστική εξέταση = μηχανισμός τραυματισμού (εξωτερική στροφή/υπερ-ραχιαία κάμψη → σκέψου συνδεσμοσύνδεση), προηγούμενες διαστρέμματα, φόρτιση βάρους, Ottawa, έλεγχος συνδέσμων· στη συνέχεια αξιολόγηση πόνου (NRS/FADI), οιδήματος (figure-of-eight), ROM (weight-bearing lunge), αρθροκινηματικής (posterior talar glide), δύναμης (δυναμόμετρο χειρός), στατικής/δυναμικής ισορροπίας (BESS/Foot Lift, SEBT), βάδισης, επιπέδου δραστηριότητας (Tegner) και PROMs (FAAM). ο χρόνος ανάρρωσης πόνου δεν ισούται με επούλωση συνδέσμου (6–12 εβδ.), άρα προσοχή στην πρόωρη επιστροφή. Γάμπα — γαστροκνήμιος έναντι υποκνημιδίου: ο γαστροκνήμιος (κυρίως έσω κεφαλή, «tennis leg») διατρέχει δύο αρθρώσεις και έχει πολλές ταχείες ίνες — οξύς πόνος/οίδημα με απότομη έκταση γόνατος· ο υποκνημίδιος είναι κυρίως αργές ίνες, μόνο ποδοκνημική — υποξεία σφίξιμο/δυσκαμψία που χειροτερεύει σε ημέρες–εβδομάδες με ήπιο οίδημα, συχνά υποδιαγνωσμένος (π.χ. ως θρομβοφλεβίτιδα). Διαφοροποίηση: ψηλάφηση + δύναμη/διάταση με γόνατο εκτεταμένο (γαστροκνήμιος) έναντι λυγισμένου ~90° (υποκνημίδιος)· ταυτόχρονη κάκωση και των δύο σε ~17% στην απεικόνιση· ο πελματιαίος σπάνια εμπλέκεται και διαγιγνώσκεται μόνο με απεικόνιση. Thompson για πλήρη ρήξη Αχιλλείου· σύγκριση περιμέτρου και λειτουργικά (άλμα, τρέξιμο) για ήπια δυσλειτουργία.",
  "Ισχίο": "Doha / ESSKA-EHPA-ESMA 2026 (Hölmich κ.ά.): 5 κλινικές οντότητες — προσαγωγοί, ιλιοψοΐτης, βουβωνικό, ηβικό, ενδοαρθρικό (συνυπάρχουν συχνά)· ρουτίνα: ψηλάφηση προσαγωγών/ψοΐτη/βουβωνικού πόρου/ηβικής, αντίσταση προσαγωγής-κάμψης-κοιλιακών, FADIR + ROM (αν ανώδυνα, το ισχίο απίθανη πηγή). Doha: ορισμοί — προσαγωγοί = ευαισθησία + πόνος σε αντίσταση προσαγωγής· ψοΐτης = ευαισθησία (+ πόνος σε αντίσταση/διάταση)· βουβωνικό = πόνος & ευαισθησία πόρου χωρίς ψηλαφητή κήλη (+ πόνος σε κοιλιακή αντίσταση/Valsalva)· ηβικό = ευαισθησία σύμφυσης & γειτονικού οστού· πάντα να εξετάζεται το ισχίο (FADIR/FABER, παθητικό ROM). Αξιοπιστία ψηλάφησης χαμηλή–μέτρια, αντίστασης προσαγωγών ικανοποιητική έως ουσιαστική (κ 0,22–0,74). Ο πόνος στο adductor squeeze (OR 4,3) και ο περιορισμός έσω στροφής/BKFO διαφοροποιούν καλύτερα αθλητές με/χωρίς πόνο. Groin-MAP: 6 σημεία για προσαγωγούς, ψοΐτη, ηβικό, ισχίο, χωρίς ελέγχους με αύξηση ενδοκοιλιακής πίεσης. Πρώτα έλεγχος σοβαρής παθολογίας & οσφυϊκής/ΙΛ, μετά ευαίσθητα τεστ (ρυθμίζουν αποκλεισμό), μετά ειδικά. Στις οξείες βουβωνικές βλάβες το 66% είναι προσαγωγοί (κυρίως μακρός προσαγωγός), 15–25% ψοΐτης/ορθός μηριαίος· 22–25% χωρίς απεικονιστικά ευρήματα· η κλινική διάγνωση ψοΐτη/ορθού συχνά εντοπίζεται αλλού στην απεικόνιση (35–46%). Παρακολούθηση με squeeze (δύναμη + πόνος), HAGOS (<50 στον αθλητισμό = ζητούν θεραπεία)· εποπτευόμενη ενεργός άσκηση > παθητικά μέσα, 50–75% επιστρέφουν στο προηγούμενο επίπεδο. Αποκατάσταση χρόνιου βουβωνικού πόνου (22 μελέτες): χαμηλή ποιότητα καταγραφής άσκησης (CERT μ.ό. 7,7/19, FRED 3,7/13)· τα προγράμματα στόχευαν συχνά προσαγωγούς, απαγωγούς, εκτείνοντες ισχίου/γόνατος και κοιλιακούς, δηλ. γενικό πρόγραμμα· ενδεικτικά κριτήρια τρεξίματος: χωρίς πόνο την επόμενη ημέρα, 15 λεπτά ανώδυνο τρέξιμο.",

        <input className="ll-sp-search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Αναζήτηση δοκιμασίας…" style={{ ...inputStyle, flex: "1 1 180px", borderRadius: 999, padding: "8px 14px" }} />

}

function RtpModule({ patientId, patientName, assessments, sessionDate }) {
  const emptyRtp = () => ({ criteria: [], decision: { level: "", date: "", note: "" }, template: "" });
  const [data, setData] = useState(emptyRtp);
  const [phase, setPhase] = useState("participation");
  const [tpl, setTpl] = useState(() => (window.__llRtp && RTP_TEMPLATES[window.__llRtp]) ? window.__llRtp : Object.keys(RTP_TEMPLATES)[0]);
  const [nf, setNf] = useState({ domain: RTP_DOMAINS[0], name: "", target: "" });
  const loaded = useRef(false);
  useEffect(() => {
    loaded.current = false;
    setData({ ...emptyRtp(), ...(patientId ? store.get(`trl_rtp_${patientId}`, {}) : {}) });
    setTimeout(() => { loaded.current = true; }, 0);
  }, [patientId]);
  const save = (next) => { setData(next); if (patientId) store.set(`trl_rtp_${patientId}`, next); };
  const upd = (id, patch) => save({ ...data, criteria: data.criteria.map((c) => c.id === id ? { ...c, ...patch } : c) });
  const setStatus = (c, st) => upd(c.id, { status: st, date: st === "yes" ? (c.date || sessionDate) : (st === "na" ? "" : c.date) });
  const stats = (ph) => {
    const list = data.criteria.filter((c) => c.phase === ph);
    const req = list.filter((c) => c.required);
    const met = list.filter((c) => c.status === "yes").length;
    const reqMet = req.filter((c) => c.status === "yes").length;
    return { total: list.length, met, req: req.length, reqMet, pct: list.length ? Math.round((met / list.length) * 100) : 0, ready: req.length > 0 && reqMet === req.length };
  };
  const loadTemplate = () => {
    const have = new Set(data.criteria.map((c) => [c.phase, c.name].join("|")));
    const add = RTP_TEMPLATES[tpl].filter((c) => !have.has([c.phase, c.name].join("|"))).map((c) => ({ ...c, id: rtpId(), status: "na", value: "", date: "", note: "" }));
    if (!add.length) return;
    save({ ...data, template: tpl, criteria: [...data.criteria, ...add] });
  };
  const addCrit = () => {
    if (!nf.name.trim()) return;
    save({ ...data, criteria: [...data.criteria, { id: rtpId(), phase, domain: nf.domain, name: nf.name.trim(), target: nf.target.trim(), required: true, status: "na", value: "", date: "", note: "" }] });
    setNf({ ...nf, name: "", target: "" });
  };
  // τελευταία συμμετρία από την εκτίμηση
  const latestSym = (() => {
    const dates = Object.keys(assessments || {}).sort().reverse();
    for (const d of dates) {
      const rows = (assessments[d].strength || []).map((r) => ({ r, v: symOf(r.L, r.R, null) })).filter((x) => x.v !== null);
      if (rows.length) return { d, rows: rows.sort((a, b) => a.v - b.v).slice(0, 4) };
    }
    return null;
  })();
  const cur = data.criteria.filter((c) => c.phase === phase);
  const st = stats(phase);
  const chipS = (on, col) => ({ padding: "6px 12px", borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: "pointer", border: `1px solid ${on ? col : T.panelLine}`, background: on ? col : "transparent", color: on ? T.bg : T.paperDim });
  if (!patientId) return <Panel title="Κριτήρια RTP">Επίλεξε ασθενή.</Panel>;
  return (
    <>
      <Panel title={`Κριτήρια επιστροφής στην απόδοση (RTP) — ${patientName || ""}`} accent>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 10, marginBottom: 14 }}>
          {RTP_PHASES.map((p, i) => {
            const s = stats(p.id); const on = phase === p.id;
            return (
              <button key={p.id} type="button" className="ll-rtp-phase" onClick={() => setPhase(p.id)} style={{ textAlign: "left", cursor: "pointer", background: on ? "color-mix(in srgb, var(--vac, #D9560B) 14%, transparent)" : T.bgSoft, border: `1px solid ${on ? T.gold : T.panelLine}`, borderRadius: 16, padding: 14, color: T.paper }}>
                <div style={{ fontSize: 11, color: T.paperDim, marginBottom: 2 }}>ΦΑΣΗ {i + 1}</div>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 14, color: on ? T.gold : T.paper }}>{p.label}</div>
                <div style={{ fontSize: 11, color: T.paperDim, margin: "3px 0 10px" }}>{p.sub}</div>
                <div style={{ height: 6, borderRadius: 999, background: T.panelLine, overflow: "hidden" }}><div style={{ width: `${s.pct}%`, height: "100%", background: s.ready ? "#2E8B4E" : T.terracotta }} /></div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, marginTop: 6, color: T.paperDim }}>
                  <span>{s.met}/{s.total} κριτήρια</span><span style={{ color: s.ready ? "#2E8B4E" : T.paperDim }}>{s.ready ? "✓ έτοιμος" : `υποχρ. ${s.reqMet}/${s.req}`}</span>
                </div>
              </button>

        <summary style={{ cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: T.gold }}>Αρχές προόδου φορτίου & επιστροφής στην απόδοση</summary>
        <ul style={{ margin: "12px 0 6px", paddingLeft: 18, fontSize: 13, lineHeight: 1.6, display: "grid", gap: 6 }}>
          <li><strong>Τοπική ικανότητα ιστού + ικανότητα ειδική για το άθλημα:</strong> η αποκατάσταση της τοπικής ικανότητας δεν αρκεί για ασφαλή επιστροφή· η sport-specific φόρτιση (π.χ. sprint) γεφυρώνει το κενό μεταξύ αποκατάστασης και απόδοσης.</li>
          <li><strong>Ο πόνος μόνος του είναι φτωχός οδηγός προόδου</strong> (εκτός από τις οστικές καταπονήσεις): υπάρχει ασυμφωνία πόνου–λειτουργίας–δομής. Προτιμάται η πρόοδος με αναφορά του ασθενή (RPE, VAS) μαζί με το εξωτερικό φορτίο.</li>
          <li><strong>Κριτήρια τοπικής προόδου (παράδειγμα Αχίλλειου):</strong> έλεγχος πόνου + (α) στάδια, (β) κόπωση — προσθήκη σετ/επαναλήψεων/βάρους αν δεν υπάρχουν σημεία κόπωσης, (γ) υποκειμενική αντίληψη, (δ) προσωρινή γραμμική αύξηση (π.χ. 2.5% εβδομαδιαία). Οι συγγραφείς σημειώνουν ότι βασίζονται σε παράδοση και όχι ισχυρά τεκμήρια.</li>
          <li><strong>Παράδοξο εκπαίδευσης–πρόληψης τραυματισμών:</strong> τα μη επαφικά τραύματα συνδέονται κυρίως με υπερβολικές και απότομες αυξήσεις φορτίου, όχι με την προπόνηση καθαυτή· τα υψηλά χρόνια φορτία είναι γενικά προστατευτικά.</li>
          <li><strong>Διαφορετικοί ιστοί, διαφορετική ανάκαμψη:</strong> κάρτιλαγε ~30 λεπτά, οστό 4–8 ώρες, τένοντας ~48 ώρες (έντονη SSC), μυς έως ≥72 ώρες· «εκπαίδευση γύρω από τον τραυματισμένο ιστό» διατηρεί τη συνολική ικανότητα.</li>
          <li><strong>Φυσιολογικά και βιομηχανικά μονοπάτια προσαρμογής</strong> έχουν διαφορετικούς ρυθμούς απόκρισης και πρέπει να θεωρούνται χωριστά στον σχεδιασμό αποκατάστασης.</li>
          <li><strong>Αθλητικές απαιτήσεις:</strong> στο rugby league οι περισσότερες επαναλαμβανόμενες προσπάθειες υψηλής έντασης γίνονται με ≤10 s ανάκαμψη — η προετοιμασία για επιστροφή πρέπει να το αντικατοπτρίζει.</li>
          <li><strong>Συναίνεση IOC — φορτίο &amp; κίνδυνος τραυματισμού:</strong> το φορτίο ορίζεται ευρέως (προπόνηση/αγώνες, αγωνιστικό πρόγραμμα, ψυχολογικό φορτίο, ταξίδια). Υψηλό <em>απόλυτο</em> φορτίο δεν είναι από μόνο του το πρόβλημα — όταν επιτυγχάνεται σταδιακά μπορεί να προστατεύει· το πρόβλημα είναι οι μεγάλες και ταχείες εβδομαδιαίες αυξήσεις (ένταση, διάρκεια, συχνότητα) σε σχέση με ό,τι έχει προετοιμαστεί ο αθλητής (acute:chronic, π.χ. τελευταία εβδομάδα vs κυλιόμενος μέσος 4 εβδομάδων). Σε επίπεδο ιστού: υπέρβαση της ικανότητας ανάλογα με ένταση, συχνότητα και διάρκεια ή ανεπαρκής ανάκαμψη ανάμεσα στους κύκλους (μηχανισμός για τενοντοπάθεια, οστικές καταπονήσεις, επιγονατιδομηριαίο). Συμφόρηση αγώνων: 8/12 μελέτες βρήκαν αυξημένο κίνδυνο. Παρακολούθηση: να μετριέται και το εξωτερικό και το εσωτερικό φορτίο ανά αθλητή (όχι μέσος όρος ομάδας)· τα υποκειμενικά μέτρα ευεξίας (κόπωση, ανάκαμψη, στρες εκτός αθλήματος, κίνητρο, συμπτώματα) ήταν πιο ευαίσθητα και συνεπή από τα αντικειμενικά· κανένας μεμονωμένος δείκτης δεν προβλέπει αξιόπιστα δυσπροσαρμογή ή τραυματισμό. Ο αθλητής μπορεί να εκτελεί ή να αντιλαμβάνεται το φορτίο διαφορετικά από ό,τι προγραμματίστηκε.</li>
          <li><strong>Κριτήρια επιστροφής στην απόδοση στο ποδόσφαιρο — </strong> η επιστροφή στην απόδοση (RTPe, 3ο στάδιο του συνεχούς Ardern: συμμετοχή → επιστροφή στο άθλημα → απόδοση) ορίζεται ελλιπώς. Τα κριτήρια που χρησιμοποιούνται: κλινική εξέταση, δύναμη, λειτουργικά τεστ, τεστ απόδοσης, χρόνος από τον τραυματισμό και PROMs· σπάνια μετρώνται ψυχολογική ετοιμότητα και απαιτήσεις του επιπέδου, και σπάνια χρησιμοποιούνται τεστ στο γήπεδο/ειδικά για το άθλημα. Οι γυναίκες υποεκπροσωπούνται (τραυματισμοί 6,77 έναντι 5,70/1000 ώρες) και οι ΧΚ υπερεκπροσωπούνται, ενώ πίσω μηριαίοι και βουβώνας μελετώνται λιγότερο. Η συναίνεση 2016 προτείνει: μπαταρία τεστ, ανοιχτά (reactive) έναντι κλειστών καθηκόντων, αξιολόγηση ψυχολογικής ετοιμότητας και παρακολούθηση εσωτερικού/εξωτερικού φορτίου. Υποτροπές 14–35%· οι τραυματισμοί στους αγώνες είναι έως 10× συχνότεροι από την προπόνηση.</li>
          <li><strong>Μυϊκές κακώσεις & ορισμοί:</strong> Μυϊκές κακώσεις: οι αποφάσεις στηρίζονται κυρίως σε πειραματικά δεδομένα· σύντομη ακινητοποίηση (λίγες ημέρες) και μετά πρώιμη ενεργός κινητοποίηση βελτιώνει τη διείσδυση των ινών στην ουλή, την αγγείωση και τον προσανατολισμό τους· πρόοδος: ισομετρικά ανώδυνα → ισοτονικά χωρίς φορτίο → με φορτίο → ισοκινητικά/λειτουργικά· για το RICE δεν υπάρχει τυχαιοποιημένη δοκιμή· υποψία οστεοποιού μυοσίτιδας αν ο πόνος/οίδημα δεν υποχωρεί σε 10–14 ημέρες. Consensus ποδοσφαίρου: συμφωνία ομάδας ειδικών για RTP μετά από κάκωση μυός κάτω άκρου στο ποδόσφαιρο (χρήση ως αναφορά). Υποτροπή εντός 2 μηνών «πρώιμη», 2–12 μήνες «όψιμη», &gt;12 μήνες «καθυστερημένη»· αγώνας εντός αποκατάστασης μετρά ως προπόνηση. MCL σε ελίτ ποδόσφαιρο: διάμεσα 33 ημέρες αποχής (3–259), 71% επιστροφή στο ίδιο επίπεδο, 3% επανατραυματισμός, 14% χειρουργείο.</li>
          <li><strong>Θεωρία φυσικής καταπόνησης &amp; αιτιώδεις οδοί φορτίου:</strong> Θεωρία φυσικής καταπόνησης: ο ιστός ανταποκρίνεται προβλέψιμα στο σχετικό επίπεδο καταπόνησης — πολύ χαμηλό (μειωμένη ανοχή/ατροφία), εύρος διατήρησης (καμία αλλαγή), υπερφόρτωση εντός ορίων (αυξημένη ανοχή/υπερτροφία), υπερβολικό (τραυματισμός), ακραίο (νέκρωση)· η έκθεση είναι σύνθετη τιμή μεγέθους, χρόνου και κατεύθυνσης και επηρεάζεται από ηλικία, φάρμακα, παχυσαρκία, κίνηση/στάση, υπόδηση, ψυχοκοινωνικούς παράγοντες. Φορτίο και τραυματισμός: δεν έχει αποδειχθεί σαφής αιτιολογία μεταξύ φορτίου προπόνησης και τραυματισμού· οι συνήθεις μετρήσεις (εσωτερικό/εξωτερικό φορτίο) είναι αναξιόπιστες για πρόβλεψη κινδύνου και απέχουν από τα μηχανικά φορτία στους ιστούς — χρειάζεται εστίαση στους μηχανισμούς (μηχανική οδός έναντι ψυχοφυσιολογικής). Δες και .</li>
          <li><strong>Προληπτικός έλεγχος κάτω άκρων σε ομαδικά αθλήματα (συστηματική ανασκόπηση):</strong> ενδείξεις για κάποια προγνωστικά τεστ — γενική χαλαρότητα αρθρώσεων (τραυματισμοί κάτω άκρου), ΑΕΤ/Star Excursion (απόσταση προσθίως &gt;4 cm διαφορά δεξιά/αριστερά), υπερέκταση γόνατος και διαφορά πρόσθιας–οπίσθιας χαλαρότητας (ΧΚ ΠΧΣ), ηλικία (οπίσθιοι μηριαίοι), λόγος προσαγωγών/απαγωγών (προσαγωγοί), δύναμη πελματιαίων κάμψεων και ταλάντωση στάσης (εξάρθρημα ποδοκνημικής)· διαφωνία για την ευκαμψία οπισθίων και τον λόγο H:Q. Δεν αρκεί για εξατομικευμένη πρόβλεψη· προτείνονται μεγαλύτερες προοπτικές μελέτες.</li>
          <li><strong>Αντικειμενικά κριτήρια RTS:</strong> τα τεκμήρια είναι περιορισμένα· τα όρια (π.χ. LSI &gt; 90%) συμπληρώνονται από κλινική κρίση. Single-leg hop LSI σε 6/9/12 μήνες μετά από ΧΣΑ: 87/90/92%.</li>

      </Panel>

          {["Δεν είναι έτοιμος", ...RTP_PHASES.map((p) => p.label)].map((l) => (

          ))}
        </div>
        {RTP_PHASES.filter((p) => stats(p.id).ready).length > 0 && <div style={{ fontSize: 12, color: "#2E8B4E", marginBottom: 10 }}>Όλα τα υποχρεωτικά κριτήρια πληρούνται για: {RTP_PHASES.filter((p) => stats(p.id).ready).map((p) => p.label).join(", ")}.</div>}
        <div style={{ display: "grid", gridTemplateColumns: "180px 1fr", gap: 10 }}>
          <Field label="Ημερομηνία"><input type="date" value={data.decision.date || ""} onChange={(e) => save({ ...data, decision: { ...data.decision, date: e.target.value } })} style={inputStyle} /></Field>

        </div>
      </Panel>
    </>
  );
}

function TrendChart({ data, series, domain, xKey }) {
  const w = 600, h = 200, padL = 38, padR = 12, padT = 10, padB = 24;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const [dMin, dMax] = domain;
  const x = (i) => padL + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const y = (v) => padT + innerH - (innerH * (v - dMin)) / (dMax - dMin || 1);
  const ticks = 5;
  const tickVals = Array.from({ length: ticks }, (_, i) => dMin + ((dMax - dMin) * i) / (ticks - 1));
  const okv = (v) => typeof v === "number" && !isNaN(v);
  const path = (key) => { let st = true; return data.map((d, i) => { if (!okv(d[key])) { st = true; return ""; } const c = `${st ? "M" : "L"} ${x(i)} ${y(d[key])}`; st = false; return c; }).join(" "); };
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 200, display: "block" }}>
        {tickVals.map((v) => <line key={v} x1={padL} x2={w - padR} y1={y(v)} y2={y(v)} stroke={T.panelLine} strokeDasharray="3 3" />)}
        {tickVals.map((v) => <text key={v} x={padL - 6} y={y(v) + 3} fontSize="9" fill={T.paperDim} textAnchor="end">{Math.round(v)}</text>)}
        {data.map((d, i) => <text key={i} x={x(i)} y={h - 6} fontSize="9" fill={T.paperDim} textAnchor="middle">{(d[xKey] || "").slice(5)}</text>)}
        {series.map((s) => (
          <g key={s.key}>
            <path d={path(s.key)} fill="none" stroke={s.color} strokeWidth="2" />
            {data.map((d, i) => okv(d[s.key]) ? <circle key={i} cx={x(i)} cy={y(d[s.key])} r="3.5" fill={s.color} /> : null)}
          </g>
        ))}
      </svg>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", paddingLeft: 8, marginTop: 4 }}>
        {series.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: T.paperDim }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: s.color, display: "inline-block" }} />{s.label}
          </div>
        ))}
      </div>
    </div>
  );
}
function autoDomain(values) {
  const nums = values.filter((v) => typeof v === "number" && !isNaN(v));
  if (!nums.length) return [0, 10];
  const max = Math.max(...nums);
  const niceMax = Math.ceil((max * 1.2) / 5) * 5 || 10;
  return [0, niceMax];
}

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) {
    try {
      let v = value, merged = false;
      if (window.llSync && window.llSync.fresh && window.llSync.fresh(key)) {
        try {
          const cur = JSON.parse(localStorage.getItem(key));
          if (Array.isArray(cur) && Array.isArray(v) && cur.concat(v).every((x) => x && typeof x === "object" && x.id != null)) {
            const ids = new Set(v.map((x) => String(x.id))); const extra = cur.filter((x) => !ids.has(String(x.id)));
            if (extra.length) { v = [...v, ...extra]; if (key.indexOf("trl_patients") !== 0 && v.every((x) => /^\d+$/.test(String(x.id)))) v.sort((a, b) => Number(b.id) - Number(a.id)); }
            merged = true;
          } else if (cur && v && typeof cur === "object" && typeof v === "object" && !Array.isArray(cur) && !Array.isArray(v)) { v = { ...cur, ...v }; merged = true; }
        } catch (e) {}
      }
      localStorage.setItem(key, JSON.stringify(v)); if (window.llSync) { window.llSync.push(key); if (merged) window.llSync.reloadSoon(); } return true;
    } catch { return false; }
  },
  remove(key) { try { localStorage.removeItem(key); if (window.llSync) window.llSync.del(key); } catch {} },
};

function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
function weekNumber(startDate, entryDate) {
  if (!startDate) return null;
  const s = new Date(startDate + "T00:00:00");
  const e = new Date(entryDate + "T00:00:00");
  const d = daysBetween(s, e);
  if (d < 0) return null;
  return Math.floor(d / 7) + 1;
}

const tissueFromText = (t) => { t = (t || "").toLowerCase(); if (/τένοντ|τενοντ/.test(t)) return "tendon"; if (/σύνδεσμ|συνδεσμ|διάστρεμμ/.test(t)) return "ligament"; if (/οστ|κάταγμ|κατάγμ/.test(t)) return "bone"; if (/νεύρ|νευρ|ριζοπάθ|ισχιαλγ|σύνδρομο καρπιαίου|παραισθ/.test(t)) return "nerve"; if (/μυ|θλάσ/.test(t)) return "muscle"; return null; };
const condTissueId = (name) => {
  const n = (name || "").trim().toLowerCase(); if (!n) return null;
  for (const r of Object.values(BODY_REGIONS)) for (const [cn, t] of (r.common || [])) if (cn.toLowerCase() === n) return tissueFromText(t) || r.tissue || null;
  return tissueFromText(n);
};

                      <button onClick={() => saveMeasurement("jump")} disabled={saving} style={{
                        width: "100%", background: T.terracotta, color: T.bg, border: "none", borderRadius: 9,
                        padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: saving ? "default" : "pointer",
                        opacity: saving ? 0.7 : 1, fontFamily: "'Space Grotesk', sans-serif",
                      }}>{saving ? "Αποθήκευση…" : "Καταχώρηση μέτρησης"}</button>
                    </div>

                    {jumpChartData.length > 1 && (
                      <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: "18px 10px 8px", marginBottom: 22 }}>
                        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 10, paddingLeft: 8 }}>Τάση ύψους άλματος</div>
                        <TrendChart data={jumpChartData} xKey="date" domain={autoDomain(jumpChartData.map((d) => d.jumpHeight))} series={[{ key: "jumpHeight", color: T.gold, label: "Ύψος άλματος (cm)" }]} />
                      </div>
                    )}

                    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: T.paperDim, marginBottom: 10 }}>Ιστορικό άλματα ({jumpEntries.length})</div>
                    {jumpEntries.length === 0 ? (
                      <div style={{ color: T.paperDim, fontSize: 13, opacity: 0.7 }}>Καμία μέτρηση ακόμη.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {jumpEntries.map((m) => (
                          <div key={m.id} style={{ background: T.bgSoft, border: `1px solid ${T.panelLine}`, borderRadius: 10, padding: "12px 14px", fontSize: 13 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                              <span style={{ fontWeight: 600 }}>{m.testType}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.paperDim }}>{m.date}{m.week ? ` · Εβδ.${m.week}` : ""}</span>
                                <button onClick={() => deleteMeasurement(m.id)} style={{ background: "none", border: "none", color: T.paperDim, cursor: "pointer", padding: 2 }}><Icon name="trash" size={13} /></button>
                              </div>
                            </div>
                            <div style={{ color: T.paperDim, fontSize: 12 }}>
                              {m.jumpHeight && <React.Fragment><strong style={{ color: T.gold }}>{m.jumpHeight} cm</strong> · </React.Fragment>}
                              {m.rsi && <React.Fragment>RSI {m.rsi} · </React.Fragment>}
                              {m.contactTime && <React.Fragment>επαφή {m.contactTime}ms · </React.Fragment>}
                              {m.flightTime && <React.Fragment>πτήση {m.flightTime}ms · </React.Fragment>}
                              {m.asymmetry && <React.Fragment>ασυμμετρία {m.asymmetry}% · </React.Fragment>}
                              {extraText(m) && <React.Fragment>{extraText(m)}</React.Fragment>}
                            </div>
                            {m.notes && <div style={{ marginTop: 6, color: T.paper, opacity: 0.85 }}>{m.notes}</div>}
                            <EntryParams item={m} onSave={(x) => updateMeasurementExtra(m.id, x)} suggestions={paramSuggestions} />
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}

                {measureTab === "isometric" && (
                  <>
                    <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: 18, marginBottom: 22 }}>
                      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, marginBottom: 14 }}>Νέα ισομετρική μέτρηση — {patientName}</div>
                      <div style={{ marginBottom: 14 }}>
                        <SelectField label="Τύπος τεστ" value={isoForm.testType} onChange={(v) => setIsoForm({ ...isoForm, testType: v })} options={ISO_TYPES} />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                        <NumberField label="Δεξιά" unit="N" value={isoForm.rightForce} onChange={(v) => setIsoForm({ ...isoForm, rightForce: v })} placeholder="420" />
                        <NumberField label="Αριστερή" unit="N" value={isoForm.leftForce} onChange={(v) => setIsoForm({ ...isoForm, leftForce: v })} placeholder="395" />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                        <NumberField label="Συνολική Peak Force" unit="N" value={isoForm.totalForce} onChange={(v) => setIsoForm({ ...isoForm, totalForce: v })} placeholder="π.χ. iMTP: 1850" />
                        <NumberField label="RFD" unit="N/s" value={isoForm.rfd} onChange={(v) => setIsoForm({ ...isoForm, rfd: v })} placeholder="προαιρετικό" />
                      </div>
                      <p style={{ fontSize: 11, color: T.paperDim, marginTop: -6, marginBottom: 14 }}>Για iMTP συνήθως μόνο "Συνολική Peak Force". Για ForceFrame (διμερή τεστ) συμπλήρωσε Δεξιά/Αριστερή — η ασυμμετρία υπολογίζεται αυτόματα.</p>
                      <ExtraMetrics items={isoForm.extra || []} onChange={(v) => setIsoForm({ ...isoForm, extra: v })} suggestions={paramSuggestions} />
                      <label style={{ display: "block", fontSize: 12, color: T.paperDim, marginBottom: 6 }}>Σημειώσεις</label>
                      <textarea value={isoForm.notes} onChange={(e) => setIsoForm({ ...isoForm, notes: e.target.value })} rows={2} style={{ ...inputStyle, marginBottom: 16, resize: "vertical" }} />
                      <button onClick={() => saveMeasurement("isometric")} disabled={saving} style={{
                        width: "100%", background: T.terracotta, color: T.bg, border: "none", borderRadius: 9,
                        padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: saving ? "default" : "pointer",
                        opacity: saving ? 0.7 : 1, fontFamily: "'Space Grotesk', sans-serif",
                      }}>{saving ? "Αποθήκευση…" : "Καταχώρηση μέτρησης"}</button>
                    </div>

                    {isoChartData.length > 1 && (
                      <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: "18px 10px 8px", marginBottom: 22 }}>
                        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 10, paddingLeft: 8 }}>Τάση δύναμης (Peak Force)</div>
                        <TrendChart data={isoChartData} xKey="date" domain={autoDomain(isoChartData.map((d) => d.force))} series={[{ key: "force", color: T.rust, label: "Peak Force (N)" }]} />
                      </div>
                    )}

                    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: T.paperDim, marginBottom: 10 }}>Ιστορικό ισομετρικά ({isoEntries.length})</div>
                    {isoEntries.length === 0 ? (
                      <div style={{ color: T.paperDim, fontSize: 13, opacity: 0.7 }}>Καμία μέτρηση ακόμη.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {isoEntries.map((m) => (
                          <div key={m.id} style={{ background: T.bgSoft, border: `1px solid ${T.panelLine}`, borderRadius: 10, padding: "12px 14px", fontSize: 13 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                              <span style={{ fontWeight: 600 }}>{m.testType}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.paperDim }}>{m.date}{m.week ? ` · Εβδ.${m.week}` : ""}</span>
                                <button onClick={() => deleteMeasurement(m.id)} style={{ background: "none", border: "none", color: T.paperDim, cursor: "pointer", padding: 2 }}><Icon name="trash" size={13} /></button>
                              </div>
                            </div>
                            <div style={{ color: T.paperDim, fontSize: 12 }}>
                              {m.totalForce && <React.Fragment><strong style={{ color: T.gold }}>{m.totalForce} N</strong> · </React.Fragment>}
                              {(m.rightForce || m.leftForce) && <React.Fragment>Δ {m.rightForce || "–"}N / Α {m.leftForce || "–"}N · </React.Fragment>}
                              {m.asymmetryCalc != null && <React.Fragment>ασυμμετρία {m.asymmetryCalc}% · </React.Fragment>}
                              {m.rfd && <React.Fragment>RFD {m.rfd} N/s · </React.Fragment>}
                              {extraText(m) && <React.Fragment>{extraText(m)}</React.Fragment>}
                            </div>
                            {m.notes && <div style={{ marginTop: 6, color: T.paper, opacity: 0.85 }}>{m.notes}</div>}
                            <EntryParams item={m} onSave={(x) => updateMeasurementExtra(m.id, x)} suggestions={paramSuggestions} />
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </>
            )}
            </div>
          </>
        )}

        </div>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: T.gold, color: T.bg, padding: "10px 20px", borderRadius: 999, fontSize: 13, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>{toast}</div>
      )}
    </div>
    {printMode && (
      <PrintDoc blank={printMode === "blank"} patient={patient} date={sessionDate} week={selWeek} visitNo={visitNo}
        a={printMode === "blank" ? emptyAssess() : assessDraft} sess={sessions[sessionDate]} dayEntries={dayEntries} dayMeas={dayMeas} />
    )}
    </>
  );
}

(window.llSync ? window.llSync.ready : Promise.resolve()).catch(() => {}).then(() => ReactDOM.createRoot(document.getElementById("root")).render(<TissueLoadLog />));
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
