<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsRehub — Διαχείριση Ραντεβού</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F5F2EA;
    --cream-2:#EFEBDF;
    --ink:#1A1714;
    --ink-soft:#4A4540;
    --orange:#E07A2C;
    --orange-dark:#C8661D;
    --line:#DDD6C6;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:16px;
  }
  h1{font-family:'Quicksand', sans-serif; font-weight:600; font-size:22px;}
  button{font-family:'Jost',sans-serif; cursor:pointer;}

  /* LOGIN */
  #login-screen{
    max-width:360px;
    margin:80px auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:28px 24px;
  }
  #login-screen h1{text-align:center; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  .field select{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; background:var(--white); color:var(--ink);}
  .field textarea{resize:vertical; min-height:60px;}
  .btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:3px;
    padding:11px 18px;
    font-weight:500;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .btn:hover{background:var(--orange-dark);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.full{width:100%;}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--cream-2); color:var(--ink);}
  .btn.danger{background:#FBEAEA; color:#8B2E24; border:1px solid #E5B4B0;}
  .btn.danger:hover{background:#F5D5D2;}
  #login-error{color:#C0392B; font-size:13px; margin-top:10px; text-align:center; display:none;}

  /* DASHBOARD */
  #dashboard{display:none; max-width:none; margin:0 auto; padding-left:10px !important; padding-right:10px !important;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;}
  .topbar .right{display:flex; gap:8px;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .seg{display:flex; gap:6px;}
  .seg button{
    padding:7px 14px;
    border-radius:16px;
    font-size:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
  }
  .seg button.active{background:var(--orange); color:var(--white); border-color:var(--orange);}
  .nav{display:flex; align-items:center; gap:8px;}
  .nav .arrow{
    width:34px; height:34px;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:50%;
    font-size:18px;
    line-height:1;
    color:var(--ink-soft);
  }
  .nav .arrow:hover{background:var(--cream-2); color:var(--ink);}
  .nav .label{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:15px;
    min-width:170px;
    text-align:center;
  }
  .nav .today{
    padding:7px 12px;
    border-radius:16px;
    font-size:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
  }

  /* TIMETABLE */
  .grid-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    overflow-x:auto;
  }
  .tgrid{display:grid;}
  .tgrid > div{min-width:0;}
  .tgrid > div{border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  .th{
    position:static; z-index:2;
    background:var(--cream-2);
    text-align:center;
    padding:8px 4px;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .th small{display:block; font-family:'Inter',sans-serif; font-weight:400; color:var(--ink-soft); font-size:11px;}

  .th.corner{left:0; z-index:3;}
  .hr{
    position:sticky; left:0; z-index:1;
    background:var(--cream-2);
    font-size:11px;
    color:var(--ink-soft);
    padding:6px 8px;
    text-align:right;
  }
  .cell{min-height:20px; padding:1px 3px; cursor:pointer; overflow:hidden;}
  .tgrid.fit{height:calc(100vh - 130px); min-height:420px;}
  .tgrid.fit .th{padding:4px 2px;}
  .th.sub{padding:2px 2px !important; font-size:11px; font-weight:600; color:#1A1714;}
  .th.sub.physio{background:var(--cat-physio);} .th.sub.gym{background:var(--cat-gym);}
  .cell.physio{background:color-mix(in srgb, var(--cat-physio) 28%, #fff);}
  .cell.gym{background:color-mix(in srgb, var(--cat-gym) 28%, #fff);}
  .cell.weekend.physio{background:color-mix(in srgb, var(--cat-physio) 38%, #fff);}
  .cell.weekend.gym{background:color-mix(in srgb, var(--cat-gym) 38%, #fff);}
  .cell.off, .cell.weekend.off{background:#E9E5DD !important; cursor:default;}
  .th.off, .th.sub.off{background:#E9E5DD !important; color:#9a928a !important;}
  .cell.halfrow{border-bottom-style:dotted;}
  .hr.half{color:#9a928a; font-size:10px;}
  .cell:hover{filter:brightness(.96);}
  .tgrid.fit .appt{border-left:3px solid var(--cat, rgba(0,0,0,.35));}
  .cell.physio .appt{border-left-color:color-mix(in srgb, var(--cat-physio) 70%, #000);} .cell.gym .appt{border-left-color:color-mix(in srgb, var(--cat-gym) 70%, #000);}
  .tgrid.fit .hr{padding:3px 6px;}
  .tgrid.fit .appt{padding:1px 4px; margin-bottom:1px; display:flex; gap:6px; align-items:baseline; white-space:nowrap; overflow:hidden; font-size:11.5px; line-height:1.35;}
  .tgrid.fit .appt b{display:inline; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0;}
  .tgrid.fit .appt span{display:inline; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 0; min-width:0; font-size:10.5px;}
  .cell.weekend{background:#FAF8F3;}
  .appt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--cream-2);
    border:none;
    border-left:3px solid var(--orange);
    border-radius:3px;
    padding:2px 6px;
    margin-bottom:2px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    line-height:1.2;
    color:var(--ink);
    cursor:pointer;
  }
  .appt.new{--bg:var(--bg-new); --fg:var(--fg-new);} .appt.completed{--bg:var(--bg-completed); --fg:var(--fg-completed);} .appt.cancelled{--bg:var(--bg-cancelled); --fg:var(--fg-cancelled);}
  .appt{background:var(--bg,#EFEBDF); color:var(--fg,#1A1714); border-left-color:rgba(0,0,0,.25);}

  .appt:hover{filter:brightness(.93);}
  .appt:hover b{text-decoration:underline;}
  .appt.cancelled b{text-decoration:line-through;}
  .search{position:relative; margin:0 0 12px;}
  .search input{width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; background:var(--white); color:var(--ink);}
  .search-res{display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:20; background:var(--white); border:1px solid var(--line); border-radius:6px; max-height:340px; overflow:auto; box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .search-res button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 14px; background:none; border:none; border-bottom:1px solid var(--line); font-family:'Inter',sans-serif; font-size:13px; color:var(--ink); cursor:pointer;}
  .search-res button:hover{background:var(--cream-2);}
  .search-res .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .search-res small{color:var(--ink-soft);}
  .search-res .none{padding:12px 14px; color:var(--ink-soft); font-size:13px;}
  .legend{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin:0 0 12px; font-size:13px; color:var(--ink-soft);}
  .legend label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .legend input[type=color]{width:28px; height:28px; border:1px solid var(--line); border-radius:6px; padding:0; background:none; cursor:pointer;}
  .legend button{background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer;}
  .appt b{display:block; font-weight:600; white-space:normal; overflow-wrap:anywhere;}
  .appt span{color:inherit; opacity:.85; font-size:11px; display:block; white-space:normal; overflow-wrap:anywhere;}

  /* MONTH */
  .cal-wrap{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:14px;}
  .cal-grid2{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:12px; text-align:center;}
  .cal-grid2 .dow{color:var(--ink-soft); font-size:10px; padding-bottom:4px;}
  .cal-grid2 .day{padding:10px 0 8px; border-radius:4px; color:var(--ink-soft); min-height:48px;}
  .cal-grid2 .day.in{cursor:pointer; color:var(--ink);}
  .cal-grid2 .day.in:hover{background:var(--cream-2);}
  .cal-grid2 .day.has{background:var(--cream-2); font-weight:600;}
  .cal-grid2 .day.today{outline:2px solid var(--orange);}
  .cal-grid2 .badge{display:block; font-size:10px; margin-top:2px; color:var(--orange-dark);}

  /* MODAL */
  .modal-back{
    position:fixed; inset:0;
    background:rgba(26,23,20,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:50;
  }
  .modal{
    background:var(--white);
    border-radius:8px;
    padding:22px 20px;
    width:100%;
    max-width:420px;
    max-height:92vh;
    overflow:auto;
  }
  .modal h2{font-family:'Quicksand',sans-serif; font-weight:600; font-size:18px; margin-bottom:14px;}
  .modal .row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .modal-actions .btn{flex:1 1 auto;}
  #modal-msg{font-size:13px; margin:4px 0 8px; display:none;}
  #modal-msg.err{color:#C0392B; display:block;}

  @media (max-width:640px){
    .nav .label{min-width:120px; font-size:14px;}
    .grid-wrap{}
  }

  /* ===== BOARD THEME — navy sidebar, pastel cards ===== */
  :root{ --paper:#F4F6FA; --ink:#1E2433; --ink-soft:#6A7385; --rule:#E4E8F0; --accent:#111111; --navy:#121212; --navy-2:#2B2B2B; }
  body{ background:#fff; font-family:'Commissioner','Inter',sans-serif; color:var(--ink); padding:0; }
  h1, .th, .hr, .nav .label, .btn, .seg button, .nav .today{ font-family:'Commissioner','Inter',sans-serif; }
  #dashboard{ padding:0 !important; margin:0; max-width:none; min-height:100vh; grid-template-columns:250px 1fr; }
  .side{ background:var(--navy); color:#E8E8E8; padding:18px 16px; display:flex; flex-direction:column; gap:10px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand img{ filter:invert(1); width:100%; max-width:200px; height:auto; display:block; margin:2px 0 12px; }
  .newbtn{ background:#fff; color:#111; border:none; border-radius:999px; padding:11px 16px; font-weight:600; font-size:14px; }
  .side .search{ position:relative; margin:4px 0 6px; }
  .side .search input{ width:100%; border:none; border-radius:999px; background:rgba(255,255,255,.1); color:#fff; padding:10px 14px; font-size:13px; font-family:inherit; }
  .side .search input::placeholder{ color:#A0A0A0; }
  .side .search-res{ left:0; right:auto; width:340px; z-index:50; }
  .side-h{ font-size:12px; font-weight:600; color:#9A9A9A; margin:12px 0 2px; }
  .vt{ display:flex; flex-direction:column; gap:2px; }
  .vt button{ text-align:left; background:transparent; border:none; color:#E8E8E8; padding:9px 12px; border-radius:10px; font-size:14px; font-weight:500; font-family:inherit; }
  .vt button.active{ background:var(--navy-2); color:#fff; }
  .vt button:hover{ background:rgba(255,255,255,.07); }
  .side .legend{ display:flex; flex-direction:column; gap:6px; margin:0; font-size:13px; color:#E8E8E8; }
  .side .legend label{ display:flex; align-items:center; justify-content:flex-start; gap:10px; width:100%; }
  .side .legend{ align-items:stretch; }
  .side .legend input[type=color]{ width:22px; height:22px; border:none; border-radius:50%; padding:0; background:none; }
  .side .legend button{ background:none; border:none; color:#A0A0A0; text-decoration:underline; text-align:left; font-size:12px; padding:2px 0; }
  .side-foot{ margin-top:auto; padding-top:12px; }
  .side-foot .btn.ghost{ background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:999px; width:100%; padding:10px; }
  .main{ padding:14px 22px 24px; min-width:0; background:#fff; }
  .toolbar{ display:flex; margin:0 0 12px; }
  .seg{ gap:6px; border:none; background:transparent; padding:0; }
  .seg button{ border:none; border-radius:999px; background:#EEF1F7; color:var(--ink-soft); font-weight:500; font-size:14px; padding:8px 18px; margin:0; }
  .seg button.active{ background:var(--accent); color:#fff; box-shadow:none; }
  .nav .arrow{ border-radius:50%; border:none; background:#EEF1F7; color:var(--ink); width:34px; height:34px; }
  .nav .arrow:hover{ background:#DCE2EE; }
  .nav .today{ border-radius:999px; border:none; background:#EEF1F7; color:var(--ink); font-weight:500; padding:8px 16px; }
  .nav .label{ font-weight:600; font-size:17px; }
  /* card board */
  .board{ display:grid; column-gap:0; }
  .bh{ padding:6px 8px 10px; text-align:center; font-weight:500; font-size:15px; color:var(--ink); position:relative; }
  .bh.today{ font-weight:700; }
  .bh.today::after{ content:''; position:absolute; left:18%; right:18%; bottom:0; height:4px; border-radius:4px 4px 0 0; background:var(--accent); }
  .bh.off{ color:#B1B8C7; font-size:12px; }
  .gband{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding:14px 6px 8px; font-weight:600; font-size:16px; border-top:1px solid var(--rule); }
  .gband .dot{ width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 1.5px #CFCFCF; }
  .gband .gcount{ color:var(--ink-soft); font-weight:500; font-size:13px; }
  .bcell{ padding:4px 6px 12px; min-height:90px; border-left:1px solid var(--rule); display:flex; flex-direction:column; gap:8px; cursor:pointer; }
  .bcell:first-of-type{ border-left:none; }
  .bcell .cnt{ text-align:right; font-size:12px; color:var(--ink-soft); min-height:14px; }
  .bcell.off{ background:repeating-linear-gradient(135deg,#F2F4F8 0 7px,#fff 7px 14px); cursor:default; }
  .bcell.physio:hover, .bcell.gym:hover{ background:#FAFBFD; }
  .card{ display:block; width:100%; text-align:left; border:none; border-radius:14px; padding:10px 12px; background:var(--bg,#F7CFA8); color:var(--fg,#1A1714); font-family:inherit; cursor:pointer; }
  .card:hover{ filter:brightness(.96); }
  .card .t{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; opacity:.85; }
  .card .t svg{ width:13px; height:13px; }
  .card b{ display:block; font-size:15px; font-weight:600; line-height:1.25; margin-top:3px; overflow-wrap:anywhere; }
  .card small{ display:block; font-size:12px; opacity:.8; margin-top:2px; overflow-wrap:anywhere; }
  .card.cancelled b{ text-decoration:line-through; }
  .card.completed{ opacity:.95; }
  .grid-wrap{ border:none; border-radius:16px; background:#fff; box-shadow:0 8px 28px rgba(20,33,75,.08); }
  .tgrid > div{ border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .th{ background:#fff; color:var(--ink); text-align:center !important; padding:4px 8px !important; font-weight:600; font-size:14px; }
  .th small{ font-size:14px !important; font-weight:600; color:var(--ink) !important; margin-left:4px; }
  .th.today{ background:#fff; color:var(--accent); box-shadow:inset 0 -4px 0 var(--accent); }
  .th.today small{ background:none; color:var(--accent) !important; padding:0; }
  .th.corner{ background:#fff; }
  .th.sub{ font-size:11px !important; font-weight:600 !important; text-align:center !important; color:var(--ink) !important; }
  .th.sub.physio{ background:color-mix(in srgb, var(--cat-physio) 55%, #fff); }
  .th.sub.gym{ background:color-mix(in srgb, var(--cat-gym) 55%, #fff); }
  .hr{ background:#fff; color:var(--ink-soft); font-weight:500; font-size:11px; text-align:right; padding-right:8px !important; }
  .hr.half{ color:#B7BFCC; font-size:10px; }
  .cell{ border-right:1px solid var(--rule); }
  .cell.physio{ background:color-mix(in srgb, var(--cat-physio) 12%, #fff); }
  .cell.gym{ background:color-mix(in srgb, var(--cat-gym) 12%, #fff); }
  .cell.weekend.physio{ background:color-mix(in srgb, var(--cat-physio) 18%, #fff); }
  .cell.weekend.gym{ background:color-mix(in srgb, var(--cat-gym) 18%, #fff); }
  .cell.halfrow{ border-bottom:1px dashed #EDF0F6 !important; }
  .cell.off, .cell.weekend.off{ background:#F1F3F8 !important; }
  .th.off, .th.sub.off{ background:#F1F3F8 !important; color:#A9B1C0 !important; padding:4px 2px !important; text-align:center !important; box-shadow:none; }
  .tgrid.fit .appt{ border-radius:10px; border-left:none !important; box-shadow:none !important; font-family:'Inter',sans-serif; font-weight:500; padding:1px 9px; }
  .tgrid.fit .appt b{ font-weight:600; }
  .modal{ border-radius:18px; border-top:none; }
  .modal h2{ font-weight:600; }
  .modal .btn{ border-radius:999px; }
  /* ===== ROUNDED EVERYWHERE ===== */
  #dashboard{ gap:0; }
  .side{ margin:12px 0 12px 12px; height:calc(100vh - 24px); border-radius:28px; }
  .main{ padding:14px 22px 24px 18px; }
  .side input[type=color], .legend input[type=color]{ -webkit-appearance:none; appearance:none; width:24px !important; height:24px !important; border-radius:50% !important; border:2px solid rgba(255,255,255,.55) !important; padding:0; overflow:hidden; background:none; }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:50%; }
  input[type=color]::-moz-color-swatch{ border:none; border-radius:50%; }
  .vt button, .side .legend label{ border-radius:999px; }
  .side-h{ padding-left:4px; }
  .gband{ background:#EDEDED; border:none; border-radius:999px; padding:10px 18px; margin:16px 0 8px; }
  .bcell{ border-left:none !important; background:#F8FAFD; border-radius:22px; margin:0 5px; padding:8px 8px 12px; }
  .bcell.physio{ background:var(--cat-physio); box-shadow:inset 0 0 0 1.5px #E3E3E3; }
  .bcell.gym{ background:var(--cat-gym); }
  .bcell.off{ background:repeating-linear-gradient(135deg,#EDEDED 0 7px,#F8F8F8 7px 14px); }
  .bh.today::after{ left:22%; right:22%; border-radius:999px; height:5px; }
  .card{ border-radius:22px; padding:12px 16px; box-shadow:0 2px 6px rgba(0,0,0,.10); }
  .card b{ font-size:15.5px; }
  .grid-wrap{ border-radius:24px; overflow:hidden; }
  .tgrid.fit .appt{ border-radius:999px; padding:1px 10px; }
  .th.today small{ border-radius:999px; }
  /* month view */
  .grid-wrap .day, .cal-grid2 .day{ border-radius:14px; }
  .day.has{ border-radius:14px; }
  .search input, .search-res{ border-radius:20px; }
  .search-res button:first-child{ border-radius:20px 20px 0 0; }
  /* dialog */
  .modal-back .modal{ border-radius:28px; padding:26px; }
  .modal input, .modal select, .modal textarea, .modal .field input, .modal .field select, .modal .field textarea{ border-radius:16px; }
  .modal .btn{ border-radius:999px; }
  #login-screen form, #login-form input, #login-form button{ border-radius:999px; }
  #login-screen .field input{ border-radius:999px; }
  .bh .pill{ display:inline-block; padding:6px 20px; border-radius:999px; }
  .bh.today::after{ display:none !important; }
  .bh.today .pill{ background:#111; color:#fff; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.22); }
  .card.new{ --bg:var(--bg-new); --fg:var(--fg-new); }
  .card.completed{ --bg:var(--bg-completed); --fg:var(--fg-completed); }
  .card.cancelled{ --bg:var(--bg-cancelled); --fg:var(--fg-cancelled); }

  /* finance (hidden area) */
  .lockbtn{ background:none; border:none; color:#fff; opacity:.28; font-size:15px; padding:6px 10px; margin-bottom:6px; cursor:pointer; border-radius:999px; }
  .lockbtn:hover{ opacity:.8; background:rgba(255,255,255,.1); }
  .fin-top{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
  .fin-card{ background:#F3F3F3; border-radius:22px; padding:16px 20px; }
  .fin-card.dark{ background:#111; color:#fff; }
  .fin-card .k{ font-size:12px; opacity:.7; margin-bottom:4px; }
  .fin-card .v{ font-size:28px; font-weight:700; letter-spacing:-.02em; }
  .fin-card .s{ font-size:12px; opacity:.7; margin-top:4px; line-height:1.5; }
  .fin-tools{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:0 0 12px; font-size:13px; color:var(--ink-soft); }
  .fin-tools input[type=text]{ border:1px solid var(--rule); border-radius:999px; padding:6px 12px; font-family:inherit; }
  .fin-tools input[type=number]{ width:72px; border:1px solid var(--rule); border-radius:999px; padding:6px 10px; font-family:inherit; }
  .fin-tools button{ background:#EEF1F7; border:none; border-radius:999px; padding:7px 14px; font-family:inherit; font-size:13px; }
  .fin-table{ width:100%; border-collapse:separate; border-spacing:0 6px; font-size:14px; }
  .fin-table th{ text-align:left; font-weight:600; font-size:12px; color:var(--ink-soft); padding:0 10px 2px; }
  .fin-table td{ background:#F7F7F7; padding:8px 10px; }
  .fin-table td:first-child{ border-radius:999px 0 0 999px; padding-left:16px; }
  .fin-table td:last-child{ border-radius:0 999px 999px 0; padding-right:16px; }
  .fin-table tr.paid td{ background:#E4F1E6; }
  .fin-table input[type=number], .fin-table select{ border:1px solid var(--rule); background:#fff; border-radius:999px; padding:5px 10px; font-family:inherit; font-size:13px; width:90px; }
  .fin-table select{ width:110px; }
  .fin-table input[type=checkbox]{ width:18px; height:18px; accent-color:#111; }
  .fin-empty{ padding:30px; text-align:center; color:var(--ink-soft); }
  .fin-err{ background:#FDECEC; color:#8A1F1F; border-radius:22px; padding:16px 20px; }

  /* ===== PHONE LAYOUT ===== */
  @media (max-width:760px){
    #dashboard{ display:block !important; grid-template-columns:1fr !important; }
    .side{ position:static !important; height:auto !important; flex-direction:row !important; flex-wrap:wrap; align-items:center; gap:8px !important; padding:10px 12px !important; overflow:visible !important; }
    .side .brand, .side .side-h, .side .legend{ display:none !important; }
    .side .newbtn{ flex:1 1 auto; padding:9px 14px; font-size:13px; }
    .side .search{ order:3; flex:1 1 100%; margin:0 !important; }
    .side .search-res{ width:auto !important; right:0 !important; }
    .side .vt{ flex-direction:row; gap:4px; }
    .side .vt button{ padding:8px 10px; font-size:12.5px; }
    .side-foot{ margin:0 !important; padding:0 !important; display:flex; gap:6px; align-items:center; }
    .side-foot .btn.ghost{ width:auto !important; padding:8px 12px; font-size:12.5px; }
    .main{ padding:10px 8px 20px !important; }
    .toolbar{ flex-direction:column; align-items:stretch; gap:8px; }
    .seg{ display:flex; } .seg button{ flex:1; padding:8px 4px; font-size:13px; }
    .nav{ justify-content:space-between; }
    .nav .label{ min-width:0 !important; flex:1; font-size:15px !important; }
    #view{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .board[style*="54px"]{ min-width:880px; }
    .grid-wrap{ overflow-x:auto !important; border-radius:12px !important; }
    .tgrid.fit{ height:calc(100vh - 230px) !important; min-height:360px; }
  }

  .agenda{ display:flex; flex-direction:column; gap:10px; }
  .ag-day{ border:1px solid var(--line); border-radius:14px; padding:8px 10px 10px; background:#fff; }
  .ag-day.today{ border-color:#111; box-shadow:0 0 0 1px #111; }
  .ag-h{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .ag-h b{ font-size:15px; } .ag-h span{ font-size:12px; color:var(--ink-soft); }
  .ag-empty{ color:var(--ink-soft); font-size:13px; padding:2px 0 6px; }
  .ag-row{ display:grid !important; grid-template-columns:10px 46px 1fr; column-gap:8px; align-items:center; width:100%; text-align:left; border:none !important; border-radius:10px !important; padding:7px 9px !important; margin:0 0 5px !important; }
  .ag-row .ag-dot{ width:8px; height:8px; border-radius:50%; grid-row:span 2; }
  .ag-row em{ font-style:normal; font-weight:600; font-size:13px; grid-row:span 2; }
  .ag-row b{ font-size:14px; display:block; white-space:nowrap !important; overflow:hidden; text-overflow:ellipsis; }
  .ag-row span{ font-size:12px !important; display:block; white-space:nowrap !important; overflow:hidden; text-overflow:ellipsis; opacity:.8; }
  .ag-row.cancelled b{ text-decoration:line-through; }
  .ag-add{ display:flex; gap:6px; margin-top:2px; }
  .ag-add .bcell{ flex:1; border:1px dashed var(--line); background:none; border-radius:10px; padding:7px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; min-height:0 !important; }

  @media (max-width:760px){
    .side .vt{ display:none !important; }
    .ag-empty{ display:none; }
    .ag-day{ padding:7px 10px 8px; }
    .ag-add .bcell{ padding:5px !important; font-size:12px; }
    .agenda{ gap:8px; }
  }

  @media (max-width:760px){ body{ padding-top:env(safe-area-inset-top) !important; } }
  .pt-sug{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--surface,#fff);border:1px solid rgba(0,0,0,.15);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:260px;overflow:auto;margin-top:4px}
  .pt-sug button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;font:inherit;color:inherit;border-bottom:1px solid rgba(0,0,0,.06)}
  .pt-sug button:last-child{border-bottom:0}
  .pt-sug button:hover,.pt-sug button.on{background:rgba(0,0,0,.06)}
  .pt-sug b{font-weight:600}.pt-sug small{opacity:.65;white-space:nowrap}
</style>
</head>

<script>
const SUPABASE_URL = 'https://kyhegdwzsqucfpzjxdif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3pUJ6LS6p9l4ycPSzOnClw_rjndX5s4';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MONTHS_SHORT = ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const DAYS_SHORT = ['Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ','Κυρ'];
const DAYS_LONG = ['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];

// ---------- date helpers (always local time, never UTC) ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dowMon = d => (d.getDay()+6)%7;                 // Monday = 0
const weekStart = d => addDays(d, -dowMon(d));
function escapeHtml(s){ const el = document.createElement('div'); el.textContent = s ?? ''; return el.innerHTML; }

// ---------- state ----------
let bookings = [];   // {id, slotId, date, time, name, phone, reason}
let mode = (window.innerWidth < 760) ? 'day' : 'week';
let anchor = new Date(); anchor.setHours(0,0,0,0);
let editing = null;  // booking being edited, or null for a new one

// ---------- status colours ----------
const DEFAULT_COLORS = { new:'#F7CFA8', completed:'#CFE3D0', cancelled:'#2B2B2B', physio:'#FFFFFF', gym:'#EDEDED' };
let colors = {...DEFAULT_COLORS};
try { Object.assign(colors, JSON.parse(localStorage.getItem('sr_colors') || '{}')); } catch(e){}
function textOn(hex){
  const n = parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#1A1714' : '#FFFFFF';
}
function applyColors(){
  const st = document.documentElement.style;
  for (const k of Object.keys(DEFAULT_COLORS)) {
    st.setProperty('--bg-'+k, colors[k]); st.setProperty('--fg-'+k, textOn(colors[k])); st.setProperty('--cat-'+k, colors[k]);
    const inp = document.getElementById('col-'+k); if (inp) inp.value = colors[k];
  }
}
function saveColors(){ try { localStorage.setItem('sr_colors', JSON.stringify(colors)); } catch(e){} }
['new','completed','cancelled','physio','gym'].forEach(k => document.getElementById('col-'+k).addEventListener('input', e => { colors[k] = e.target.value; saveColors(); applyColors(); }));
document.getElementById('col-reset').addEventListener('click', () => { colors = {...DEFAULT_COLORS}; saveColors(); applyColors(); });
applyColors();

// ---------- auth ----------
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Σύνδεση…';
  const { error } = await supa.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value
  });
  btn.disabled = false; btn.textContent = 'Σύνδεση';
  if (error) { errEl.style.display = 'block'; return; }
  showDashboard();
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await supa.auth.signOut();
  location.reload();
});
async function checkSession(){
  const { data } = await supa.auth.getSession();
  if (data.session) showDashboard();
}
function showDashboard(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'grid';
  loadBookings();
}

// ---------- data ----------
async function loadBookings(){
  const view = document.getElementById('view');
  view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-soft)">Φόρτωση…</div>';
  let data, error;
  for (const sel of [
    'id, full_name, phone, reason, status, availability:slot_id ( id, slot_date, slot_time, category )',
    'id, full_name, phone, reason, status, availability:slot_id ( id, slot_date, slot_time )',
    'id, full_name, phone, reason, availability:slot_id ( id, slot_date, slot_time )'
  ]) {
    ({ data, error } = await supa.from('bookings').select(sel));
    if (!error) break;
  }
  if (error) {
    console.error(error);
    view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-soft)">Σφάλμα φόρτωσης. Δοκίμασε ανανέωση.</div>';
    return;
  }
  bookings = (data || []).filter(b => b.availability).map(b => ({
    id: b.id,
    slotId: b.availability.id,
    date: b.availability.slot_date,
    time: b.availability.slot_time.slice(0,5),
    name: b.full_name,
    phone: b.phone,
    reason: b.reason || '',
    status: b.status || 'new',
    cat: b.availability.category === 'gym' ? 'gym' : 'physio'
  }));
  render();
}

// ---------- rendering ----------
let viewType = 'cards';
try { viewType = localStorage.getItem('sr_vt') || 'cards'; } catch(e){}
function setLabel(days){

function renderTimetable(days){
  const label = document.getElementById('range-label');
  if (days.length === 1) {
    const d = days[0];
    label.textContent = `${DAYS_LONG[dowMon(d)]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
  } else {
    const a = days[0], b = days[6];
    label.textContent = `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]} ${b.getFullYear()}`;
  }

  const keys = days.map(ymd);
  const inRange = bookings.filter(b => keys.includes(b.date));
  const bucket = t => { const [h,m] = t.split(':').map(Number); return h*60 + (m>=30?30:0); };
  let first = 9*60, last = 20*60;
  inRange.forEach(b => { const k = bucket(b.time); first = Math.min(first,k); last = Math.max(last,k); });
  const nRows = (last-first)/30 + 1;

  const todayKey = ymd(new Date());
  const colMin = days.length === 1 ? (window.innerWidth < 760 ? 140 : 260) : (window.innerWidth < 760 ? 64 : 80);
  const CATS = [['physio','Φυσιο'],['gym','Γυμ']];
  let html = `<div class="grid-wrap"><div class="tgrid fit" style="grid-template-columns:52px ${days.map(d => (dowMon(d)===6 && days.length>1) ? '20px 20px' : `repeat(2, minmax(${colMin}px, 1fr))`).join(' ')}; grid-template-rows:auto auto repeat(${nRows}, minmax(min-content, 1fr)); min-width:${52 + days.reduce((a,d) => a + ((dowMon(d)===6 && days.length>1) ? 40 : 2*colMin), 0)}px">`;
  html += '<div class="th corner" style="grid-row:span 2"></div>';
  days.forEach(d => {
    html += `<div class="th${ymd(d)===todayKey?' today':''}${dowMon(d)===6?' off':''}" style="grid-column:span 2">${dowMon(d)===6 && days.length>1 ? '<span style="font-size:10px;font-weight:600">Κυρ</span>' : DAYS_SHORT[dowMon(d)] + ' <small style="display:inline">' + d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + '</small>'}</div>`;
  });
  days.forEach(d => CATS.forEach(([c,l]) => { html += `<div class="th sub ${c}${dowMon(d)===6?' off':''}">${dowMon(d)===6?'':l}</div>`; }));
  for (let k = first; k <= last; k += 30) {
    const hh = pad(Math.floor(k/60)), mm = pad(k%60);
    html += `<div class="hr${k%60?' half':''}">${hh}:${mm}</div>`;
    days.forEach(d => {
      const key = ymd(d);
      CATS.forEach(([c]) => {
        const items = inRange
          .filter(b => b.date === key && b.cat === c && bucket(b.time) === k)
          .sort((a,b) => a.time.localeCompare(b.time));
        html += `<div class="cell ${c}${dowMon(d)>=5?' weekend':''}${dowMon(d)===6?' off':''}${k%60?' halfrow':''}" data-date="${key}" data-time="${hh}:${mm}" data-cat="${c}">` +
          items.map(b => `<button class="appt ${b.status}" data-id="${b.id}" title="${escapeHtml(b.time+' '+b.name+' '+b.phone+(b.reason?' · '+b.reason:''))}"><b>${b.time===hh+':'+mm?'':b.time+' '}${escapeHtml(b.name)}</b><span>${escapeHtml(b.phone)}${b.reason ? ' · ' + escapeHtml(b.reason) : ''}</span></button>`).join('') +
          '</div>';
      });
    });
  }
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;
}

// ---------- slot helpers ----------
// Normal bookable slots: Mon–Fri, on the hour, 09:00–20:00. Anything else is a one-off slot created by hand.
function isRegularSlot(date, time, cat){
  if (cat === 'gym') return true;   // gym rows are hidden from the public and simply freed on cancel
  const d = parseYmd(date);
  const [h, m] = time.split(':').map(Number);
  return dowMon(d) < 5 && m === 0 && h >= 9 && h <= 20;
}
// Finds (or creates) the slot row for date/time/category and returns {id, cap, used}.
// A slot can hold up to `cap` people; the database keeps is_booked in sync (full = true).
function slotQuery(date, time, cat){
  let q = supa.from('availability').select('*').eq('slot_date', date).eq('slot_time', time + ':00');
  return cat === 'gym' ? q.eq('category', 'gym') : q.neq('category', 'gym');
}
async function slotInfo(date, time, cat, ignoreBookingId){
  const { data: row } = await slotQuery(date, time, cat).maybeSingle();
  const defCap = cat === 'gym' ? 4 : 1;
  if (!row) return { id: null, cap: defCap, used: 0 };
  const { data: bs } = await supa.from('bookings').select('id, status').eq('slot_id', row.id);
  const used = (bs || []).filter(b => b.status !== 'cancelled' && b.id !== ignoreBookingId).length;
  return { id: row.id, cap: row.capacity || 1, used };
}
// Returns a slot id with a free place (and capacity set to `cap`), or null if the slot is full.
async function claimSlot(date, time, keepSlotId, cat, cap, ignoreBookingId){
  cat = cat || 'physio'; cap = cap || (cat === 'gym' ? 4 : 1);
  const info = await slotInfo(date, time, cat, ignoreBookingId);
  if (info.id) {
    if (info.id === keepSlotId) { if (info.cap !== cap) await supa.from('availability').update({ capacity: cap }).eq('id', info.id); return info.id; }
    if (info.used >= Math.max(cap, 1)) return null;
    if (info.cap !== cap) { const { error } = await supa.from('availability').update({ capacity: cap }).eq('id', info.id); if (error) throw error; }
    return info.id;
  }
  const row = { slot_date: date, slot_time: time + ':00', is_booked: false, capacity: cap };
  if (cat === 'gym') row.category = 'gym';
  const { data: created, error } = await supa.from('availability').insert(row).select().single();
  if (error) throw error;
  return created.id;
}
// After a cancel/move/delete: the database already recalculates "full". One-off slots with no bookings left are removed
// so they never show up as public availability.
async function releaseSlot(slotId, date, time, cat){
  if (isRegularSlot(date, time, cat)) return;
  const { data: bs } = await supa.from('bookings').select('id').eq('slot_id', slotId).limit(1);
  if (!bs || !bs.length) await supa.from('availability').delete().eq('id', slotId);
}

}

const nrm = s => (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ς/g, 'σ').replace(/\s+/g, ' ').trim();
function patientList(){
  const m = new Map();
  bookings.slice().sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time)).forEach(b => {
    const key = nrm(b.phone).replace(/\D/g, '') || nrm(b.name);
    if (!m.has(key)) m.set(key, { name: b.name, phone: b.phone, last: b.date, n: 0, n2: nrm(b.name), p2: (b.phone || '').replace(/\D/g, '') });
    m.get(key).n++;
  });
  return Array.from(m.values());
}
function sugSearch(q, byPhone){
  q = byPhone ? q.replace(/\D/g, '') : nrm(q);
  if (q.length < (byPhone ? 3 : 2)) return [];
  const toks = byPhone ? [q] : q.split(' ');
  return patientList().filter(p => byPhone ? p.p2.includes(q) : toks.every(t => p.n2.includes(t)))
    .sort((x, y) => (nrm(x.name).startsWith(q) ? 0 : 1) - (nrm(y.name).startsWith(q) ? 0 : 1)).slice(0, 8);
}
function showSug(boxId, list){
  const box = document.getElementById(boxId);
  if (!list.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.innerHTML = list.map((p, i) => `<button type="button" data-i="${i}"><span><b>${escapeHtml(p.name)}</b><br><small>${escapeHtml(p.phone)}</small></span><small>${p.n} ραντεβού · τελευταίο ${p.last.split('-').reverse().join('/')}</small></button>`).join('');
  box.style.display = 'block'; box._list = list;
}
function pickPatient(p){
  document.getElementById('f-name').value = p.name; document.getElementById('f-phone').value = p.phone;
  ['pt-sug','pt-sug2'].forEach(i => { const b = document.getElementById(i); b.style.display = 'none'; b.innerHTML = ''; });
  document.getElementById('f-reason').focus();
}
[['f-name','pt-sug',false],['f-phone','pt-sug2',true]].forEach(([inp, box, byPhone]) => {
  const input = document.getElementById(inp), bx = document.getElementById(box);
  input.addEventListener('input', () => { if (editing) return showSug(box, []); showSug(box, sugSearch(input.value, byPhone)); });

    if (bx.style.display === 'none') return;
    const items = Array.from(bx.querySelectorAll('button')); let k = items.findIndex(x => x.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items.forEach(x => x.classList.remove('on')); k = (k + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[k].classList.add('on'); }
    else if (e.key === 'Enter' && k >= 0) { e.preventDefault(); pickPatient(bx._list[k]); }
    else if (e.key === 'Escape') { bx.style.display = 'none'; }
  });
  bx.addEventListener('mousedown', e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pickPatient(bx._list[+b.dataset.i]); } });

    if (!editing) {
      const slotId = await claimSlot(date, time, null, cat, cap);
      if (!slotId) { setMsg('Το slot είναι πλήρες (' + cap + '/' + cap + ' άτομα). Αύξησε τις θέσεις ή διάλεξε άλλη ώρα.'); return; }
      const { error } = await supa.from('bookings').insert({ slot_id: slotId, full_name: name, phone, reason, language: 'el' });
      if (error) throw error;
      sendSms(phone, name, date, time);
    } else {
      const status = document.getElementById('f-status').value;
      const wasActive = editing.status !== 'cancelled', willBeActive = status !== 'cancelled';
      const regularOld = isRegularSlot(editing.date, editing.time, editing.cat);
      let slotId = editing.slotId, moved = false;
      if (wasActive && willBeActive) {
        moved = date !== editing.date || time !== editing.time || cat !== editing.cat;
        if (moved) {
          slotId = await claimSlot(date, time, cat === editing.cat ? editing.slotId : null, cat, cap, editing.id);
          if (!slotId) { setMsg('Το slot είναι πλήρες. Αύξησε τις θέσεις ή διάλεξε άλλη ώρα.'); return; }
        }
      } else if (!wasActive && willBeActive) {          // un-cancel: take a slot again
        slotId = await claimSlot(date, time, regularOld ? null : editing.slotId, cat, cap, editing.id);
        if (!slotId) { setMsg('Το slot είναι πλήρες. Αύξησε τις θέσεις ή διάλεξε άλλη ώρα.'); return; }
        moved = date !== editing.date || time !== editing.time || cat !== editing.cat;
      }
      if (!moved && willBeActive) await supa.from('availability').update({ capacity: cap }).eq('id', slotId);
      const upd = { slot_id: slotId, full_name: name, phone, reason, status };
      let { error } = await supa.from('bookings').update(upd).eq('id', editing.id);
      if (error) throw error;
      if (wasActive && !willBeActive) { if (regularOld) await releaseSlot(editing.slotId, editing.date, editing.time, editing.cat); }
      else if (moved && wasActive) await releaseSlot(editing.slotId, editing.date, editing.time, editing.cat);
      else if (moved && !wasActive && !regularOld) await releaseSlot(editing.slotId, editing.date, editing.time, editing.cat);
      if (moved) {
        if (confirm('Η ημερομηνία/ώρα άλλαξε. Να σταλεί SMS ενημέρωσης στον ασθενή;')) sendSms(phone, name, date, time);
      }
    }
    closeModal();
    anchor = parseYmd(date);
    await loadBookings();
  } catch (err) {
    console.error(err);
    setMsg(/slot_full/.test(String(err && (err.message || err))) ? 'Το slot είναι πλήρες.' : 'Κάτι πήγε στραβά. Δοκίμασε ξανά.');
  } finally {
    btn.disabled = false; btn.textContent = 'Αποθήκευση';
  }
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!editing) return;
  if (!confirm('Οριστική διαγραφή αυτού του ραντεβού; (Για απλή ακύρωση, άλλαξε την Κατάσταση σε «Ακυρωμένο».)')) return;
  const b = editing;
  const { error } = await supa.from('bookings').delete().eq('id', b.id);
  if (error) { console.error(error); setMsg('Σφάλμα κατά την ακύρωση.'); return; }
  if (b.status !== 'cancelled') await releaseSlot(b.slotId, b.date, b.time, b.cat);
  else if (!isRegularSlot(b.date, b.time, b.cat)) await releaseSlot(b.slotId, b.date, b.time, b.cat);
  closeModal();
  await loadBookings();
});


// ---------- finance (hidden, PIN-locked) ----------
let financeOn = false, finUnlocked = false, payments = {}, finLoadError = false;
const METHODS = { cash:'Μετρητά', card:'Κάρτα', bank:'Τράπεζα' };
let priceList = { physio:[50,30,25], gym:[80,160,240] };
try { const pl = JSON.parse(localStorage.getItem('sr_pricelist') || 'null'); if (pl && pl.physio && pl.gym) priceList = pl; } catch(e){}
const customRows = new Set();
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sr:' + t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }
async function askPin(){
  let stored = null; try { stored = localStorage.getItem('sr_pin'); } catch(e){}
  if (!stored) {
    const a = prompt('Όρισε PIN για τα Οικονομικά (τουλάχιστον 4 ψηφία):'); if (!a) return false;
    if (a.length < 4) { alert('Το PIN πρέπει να έχει τουλάχιστον 4 ψηφία.'); return false; }
    const b = prompt('Ξαναγράψε το PIN:'); if (a !== b) { alert('Τα PIN δεν ταιριάζουν.'); return false; }
    try { localStorage.setItem('sr_pin', await sha(a)); } catch(e){}
    return true;
  }
  const a = prompt('PIN:'); if (!a) return false;
  if (await sha(a) === stored) return true;
  alert('Λάθος PIN.'); return false;
}
async function openFinance(){
  if (!finUnlocked) { if (!await askPin()) return; finUnlocked = true; }
  financeOn = true; mode = 'month'; anchor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  document.querySelectorAll('#mode-seg button').forEach(b => b.classList.remove('active'));
  await loadPayments(); render();
}
function closeFinance(){ financeOn = false; if (mode === 'month') mode = 'week'; render(); }
async function loadPayments(){
  const { data, error } = await supa.from('payments').select('*');
  finLoadError = !!error; payments = {};
  (data || []).forEach(r => { payments[r.booking_id] = r; });
}
const money = n => (Math.round(n * 100) / 100).toLocaleString('el-GR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
function amountCell(b, p){
  const list = priceList[b.cat] || [], amt = +p.amount || 0;
  if (customRows.has(b.id) || (amt && !list.includes(amt))) return `<input type="number" min="0" step="0.5" data-f="amount" value="${amt || ''}" placeholder="€" ${customRows.has(b.id) ? 'autofocus' : ''}>`;
  return `<select data-f="amountsel"><option value="">—</option>${list.map(v => `<option value="${v}"${amt===v?' selected':''}>${v} €</option>`).join('')}<option value="other">Άλλο…</option></select>`;
}
function renderFinance(){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  document.getElementById('range-label').textContent = MONTHS[m] + ' ' + y + ' — Οικονομικά';
  const view = document.getElementById('view');
  if (finLoadError) { view.innerHTML = '<div class="fin-err">Ο πίνακας οικονομικών δεν υπάρχει ακόμα. Τρέξε το αρχείο <b>admin-finance.sql</b> στο Supabase (SQL Editor) και ξαναφόρτωσε τη σελίδα.</div>'; return; }
  const prefix = y + '-' + pad(m+1);
  const rows = bookings.filter(b => b.date.startsWith(prefix) && b.status !== 'cancelled').sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
  const pay = id => payments[id] || { amount:0, paid:false, method:null, receipt:false };
  let paidSum = 0, unpaidSum = 0, unpaidN = 0; const byCat = { physio:0, gym:0 }, byMethod = { cash:0, card:0, bank:0 };
  rows.forEach(b => { const p = pay(b.id); if (p.paid) { paidSum += +p.amount; byCat[b.cat] += +p.amount; if (p.method) byMethod[p.method] += +p.amount; } else { unpaidN++; unpaidSum += +p.amount; } });
  let html = `<div class="fin-top">
    <div class="fin-card dark"><div class="k">Εισπράξεις μήνα</div><div class="v">${money(paidSum)}</div><div class="s">${rows.length - unpaidN} από ${rows.length} ραντεβού πληρωμένα</div></div>
    <div class="fin-card"><div class="k">Απλήρωτα</div><div class="v">${unpaidN}</div><div class="s">${unpaidSum ? 'Αναμενόμενο: ' + money(unpaidSum) : ' '}</div></div>
    <div class="fin-card"><div class="k">Ανά τμήμα</div><div class="s">Φυσιοθεραπεία: <b>${money(byCat.physio)}</b><br>Γυμναστήριο: <b>${money(byCat.gym)}</b></div></div>
    <div class="fin-card"><div class="k">Ανά τρόπο πληρωμής</div><div class="s">Μετρητά: <b>${money(byMethod.cash)}</b><br>Κάρτα: <b>${money(byMethod.card)}</b><br>Τράπεζα: <b>${money(byMethod.bank)}</b></div></div>
  </div>
  <div class="fin-tools"><span>Τιμοκατάλογος (€):</span>
    <label>Φυσιοθεραπεία <input type="text" id="pl-physio" value="${priceList.physio.join(' / ')}" style="width:130px"></label>
    <label>Γυμναστήριο <input type="text" id="pl-gym" value="${priceList.gym.join(' / ')}" style="width:150px"></label>
    <button id="pin-change">Αλλαγή PIN</button><button id="fin-lock">Κλείδωμα</button></div>`;
  if (!rows.length) html += '<div class="fin-empty">Δεν υπάρχουν ραντεβού αυτόν τον μήνα.</div>';
  else {
    html += '<table class="fin-table"><thead><tr><th>Ημ/νία</th><th>Ώρα</th><th>Ονοματεπώνυμο</th><th>Τμήμα</th><th>Ποσό</th><th>Τρόπος</th><th>Πληρώθηκε</th><th>Απόδειξη</th></tr></thead><tbody>';
    rows.forEach(b => {
      const p = pay(b.id), d = parseYmd(b.date);
      html += `<tr class="${p.paid ? 'paid' : ''}" data-id="${b.id}">
        <td>${DAYS_SHORT[dowMon(d)]} ${d.getDate()}/${m+1}</td><td>${b.time}</td><td><b>${escapeHtml(b.name)}</b></td><td>${b.cat === 'gym' ? 'Γυμναστήριο' : 'Φυσιοθεραπεία'}</td>
        <td>${amountCell(b, p)}</td>
        <td><select data-f="method"><option value="">—</option>${Object.entries(METHODS).map(([k,v]) => `<option value="${k}"${p.method===k?' selected':''}>${v}</option>`).join('')}</select></td>
        <td><input type="checkbox" data-f="paid"${p.paid?' checked':''}></td>
        <td><input type="checkbox" data-f="receipt"${p.receipt?' checked':''}></td></tr>`;
    });
    html += '</tbody></table>';
  }
  view.innerHTML = html;
}
async function savePayment(id, patch){
  const cur = payments[id] || { booking_id:id, amount:0, paid:false, method:null, receipt:false };
  const next = { ...cur, ...patch, booking_id:id, updated_at:new Date().toISOString() };
  if (patch.paid === true && !cur.paid) next.paid_at = new Date().toISOString();
  payments[id] = next;
  const { error } = await supa.from('payments').upsert({ booking_id:id, amount:+next.amount || 0, paid:!!next.paid, method:next.method || null, receipt:!!next.receipt, paid_at:next.paid_at || null, updated_at:next.updated_at }, { onConflict:'booking_id' });
  if (error) { console.error(error); alert('Δεν αποθηκεύτηκε. Δοκίμασε ξανά.'); }
}
document.getElementById('fin-btn').addEventListener('click', openFinance);
document.getElementById('view').addEventListener('change', async e => {
  if (!financeOn) return;
  const t = e.target;
  if (t.id === 'pl-physio' || t.id === 'pl-gym') {
    const arr = t.value.split(/[\/,;\s]+/).map(Number).filter(n => n > 0);
    if (arr.length) priceList[t.id.slice(3)] = arr;
    try { localStorage.setItem('sr_pricelist', JSON.stringify(priceList)); } catch(_){}
    renderFinance(); return;
  }
  const tr = t.closest('tr[data-id]'); if (!tr || !t.dataset.f) return;
  const id = tr.dataset.id, b = bookings.find(x => x.id === id), f = t.dataset.f, patch = {};
  if (f === 'amountsel') {
    if (t.value === 'other') { customRows.add(id); renderFinance(); const inp = document.querySelector(`tr[data-id="${id}"] input[data-f=amount]`); if (inp) inp.focus(); return; }
    patch.amount = +t.value || 0;
  }
  else if (f === 'amount') { patch.amount = +t.value || 0; customRows.delete(id); }
  else if (f === 'method') patch.method = t.value || null;
  else patch[f] = t.checked;
  if (f === 'paid' && t.checked && !(+(payments[id]||{}).amount) && (priceList[b.cat]||[])[0]) patch.amount = priceList[b.cat][0];
  await savePayment(id, patch); renderFinance();
});
document.getElementById('view').addEventListener('click', async e => {
  if (!financeOn) return;
  if (e.target.id === 'fin-lock') { finUnlocked = false; closeFinance(); }
  if (e.target.id === 'pin-change') { try { localStorage.removeItem('sr_pin'); } catch(_){} finUnlocked = false; closeFinance(); alert('Το PIN διαγράφηκε. Την επόμενη φορά θα ορίσεις νέο.'); }
});

checkSession();
</script>
