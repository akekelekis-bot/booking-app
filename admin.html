<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsRehub — Διαχείριση Ραντεβού</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F5F2EA;
    --cream-2:#EFEBDF;
    --ink:#1A1714;
    --ink-soft:#4A4540;
    --orange:#E07A2C;
    --orange-dark:#C8661D;
    --line:#DDD6C6;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:16px;
  }
  h1{font-family:'Quicksand', sans-serif; font-weight:600; font-size:22px;}
  button{font-family:'Jost',sans-serif; cursor:pointer;}

  /* LOGIN */
  #login-screen{
    max-width:360px;
    margin:80px auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:28px 24px;
  }
  #login-screen h1{text-align:center; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:3px;
    padding:11px 18px;
    font-weight:500;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .btn:hover{background:var(--orange-dark);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.full{width:100%;}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--cream-2); color:var(--ink);}
  .btn.danger{background:#FBEAEA; color:#8B2E24; border:1px solid #E5B4B0;}
  .btn.danger:hover{background:#F5D5D2;}
  #login-error{color:#C0392B; font-size:13px; margin-top:10px; text-align:center; display:none;}

  /* DASHBOARD */
  #dashboard{display:none; max-width:1100px; margin:0 auto;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;}
  .topbar .right{display:flex; gap:8px;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .seg{display:flex; gap:6px;}
  .seg button{
    padding:7px 14px;
    border-radius:16px;
    font-size:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
  }
  .seg button.active{background:var(--orange); color:var(--white); border-color:var(--orange);}
  .nav{display:flex; align-items:center; gap:8px;}
  .nav .arrow{
    width:34px; height:34px;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:50%;
    font-size:18px;
    line-height:1;
    color:var(--ink-soft);
  }
  .nav .arrow:hover{background:var(--cream-2); color:var(--ink);}
  .nav .label{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:15px;
    min-width:170px;
    text-align:center;
  }
  .nav .today{
    padding:7px 12px;
    border-radius:16px;
    font-size:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
  }

  /* TIMETABLE */
  .grid-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:auto;
    max-height:calc(100vh - 190px);
  }
  .tgrid{display:grid;}
  .tgrid > div{min-width:0;}
  .tgrid > div{border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  .th{
    position:sticky; top:0; z-index:2;
    background:var(--cream-2);
    text-align:center;
    padding:8px 4px;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .th small{display:block; font-family:'Inter',sans-serif; font-weight:400; color:var(--ink-soft); font-size:11px;}
  .th.today{background:var(--orange); color:var(--white);}
  .th.today small{color:var(--white);}
  .th.corner{left:0; z-index:3;}
  .hr{
    position:sticky; left:0; z-index:1;
    background:var(--cream-2);
    font-size:11px;
    color:var(--ink-soft);
    padding:6px 8px;
    text-align:right;
  }
  .cell{min-height:58px; padding:3px; cursor:pointer; overflow:hidden;}
  .cell:hover{background:#FBF8F1;}
  .cell.weekend{background:#FAF8F3;}
  .appt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--cream-2);
    border:none;
    border-left:3px solid var(--orange);
    border-radius:3px;
    padding:5px 7px;
    margin-bottom:3px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    line-height:1.3;
    color:var(--ink);
    cursor:pointer;
  }
  .appt:hover{background:#F6DFC8;}
  .appt b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appt span{color:var(--ink-soft); font-size:11px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* MONTH */
  .cal-wrap{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:14px;}
  .cal-grid2{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:12px; text-align:center;}
  .cal-grid2 .dow{color:var(--ink-soft); font-size:10px; padding-bottom:4px;}
  .cal-grid2 .day{padding:10px 0 8px; border-radius:4px; color:var(--ink-soft); min-height:48px;}
  .cal-grid2 .day.in{cursor:pointer; color:var(--ink);}
  .cal-grid2 .day.in:hover{background:var(--cream-2);}
  .cal-grid2 .day.has{background:var(--cream-2); font-weight:600;}
  .cal-grid2 .day.today{outline:2px solid var(--orange);}
  .cal-grid2 .badge{display:block; font-size:10px; margin-top:2px; color:var(--orange-dark);}

  /* MODAL */
  .modal-back{
    position:fixed; inset:0;
    background:rgba(26,23,20,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:50;
  }
  .modal{
    background:var(--white);
    border-radius:8px;
    padding:22px 20px;
    width:100%;
    max-width:420px;
    max-height:92vh;
    overflow:auto;
  }
  .modal h2{font-family:'Quicksand',sans-serif; font-weight:600; font-size:18px; margin-bottom:14px;}
  .modal .row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .modal-actions .btn{flex:1 1 auto;}
  #modal-msg{font-size:13px; margin:4px 0 8px; display:none;}
  #modal-msg.err{color:#C0392B; display:block;}

  @media (max-width:640px){
    .nav .label{min-width:120px; font-size:14px;}
    .grid-wrap{max-height:calc(100vh - 230px);}
  }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Διαχείριση Ραντεβού</h1>
  <form id="login-form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div class="field">
      <label>Κωδικός</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn full" id="login-btn">Σύνδεση</button>
    <div id="login-error">Λάθος στοιχεία σύνδεσης.</div>
  </form>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>Ραντεβού</h1>
    <div class="right">
      <button class="btn" id="new-btn">+ Νέο ραντεβού</button>
      <button class="btn ghost" id="logout-btn">Αποσύνδεση</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="seg" id="mode-seg">
      <button data-mode="day">Ημέρα</button>
      <button data-mode="week" class="active">Εβδομάδα</button>
      <button data-mode="month">Μήνας</button>
    </div>
    <div class="nav">
      <button class="arrow" id="prev-btn" aria-label="Προηγούμενο">‹</button>
      <span class="label" id="range-label">—</span>
      <button class="arrow" id="next-btn" aria-label="Επόμενο">›</button>
      <button class="today" id="today-btn">Σήμερα</button>
    </div>
  </div>

  <div id="view"></div>
</div>

<!-- Add / edit appointment -->
<div class="modal-back" id="modal">
  <div class="modal">
    <h2 id="modal-title">Ραντεβού</h2>
    <form id="appt-form">
      <div class="row">
        <div class="field"><label>Ημερομηνία</label><input type="date" id="f-date" required></div>
        <div class="field"><label>Ώρα</label><input type="time" id="f-time" required></div>
      </div>
      <div class="field"><label>Ονοματεπώνυμο</label><input type="text" id="f-name" required></div>
      <div class="field"><label>Τηλέφωνο</label><input type="tel" id="f-phone" required></div>
      <div class="field"><label>Αιτιολογία / Σημείωση</label><textarea id="f-reason"></textarea></div>
      <div id="modal-msg"></div>
      <div class="modal-actions">
        <button type="submit" class="btn" id="save-btn">Αποθήκευση</button>
        <button type="button" class="btn danger" id="delete-btn">Ακύρωση ραντεβού</button>
        <button type="button" class="btn ghost" id="close-btn">Κλείσιμο</button>
      </div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kyhegdwzsqucfpzjxdif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3pUJ6LS6p9l4ycPSzOnClw_rjndX5s4';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MONTHS_SHORT = ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const DAYS_SHORT = ['Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ','Κυρ'];
const DAYS_LONG = ['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];

// ---------- date helpers (always local time, never UTC) ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dowMon = d => (d.getDay()+6)%7;                 // Monday = 0
const weekStart = d => addDays(d, -dowMon(d));
function escapeHtml(s){ const el = document.createElement('div'); el.textContent = s ?? ''; return el.innerHTML; }

// ---------- state ----------
let bookings = [];   // {id, slotId, date, time, name, phone, reason}
let mode = 'week';
let anchor = new Date(); anchor.setHours(0,0,0,0);
let editing = null;  // booking being edited, or null for a new one

// ---------- auth ----------
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Σύνδεση…';
  const { error } = await supa.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value
  });
  btn.disabled = false; btn.textContent = 'Σύνδεση';
  if (error) { errEl.style.display = 'block'; return; }
  showDashboard();
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await supa.auth.signOut();
  location.reload();
});
async function checkSession(){
  const { data } = await supa.auth.getSession();
  if (data.session) showDashboard();
}
function showDashboard(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadBookings();
}

// ---------- data ----------
async function loadBookings(){
  const view = document.getElementById('view');
  view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-soft)">Φόρτωση…</div>';
  const { data, error } = await supa
    .from('bookings')
    .select('id, full_name, phone, reason, availability:slot_id ( id, slot_date, slot_time )');
  if (error) {
    console.error(error);
    view.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-soft)">Σφάλμα φόρτωσης. Δοκίμασε ανανέωση.</div>';
    return;
  }
  bookings = (data || []).filter(b => b.availability).map(b => ({
    id: b.id,
    slotId: b.availability.id,
    date: b.availability.slot_date,
    time: b.availability.slot_time.slice(0,5),
    name: b.full_name,
    phone: b.phone,
    reason: b.reason || ''
  }));
  render();
}

// ---------- rendering ----------
function render(){
  document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'month') renderMonth();
  else renderTimetable(mode === 'day' ? [anchor] : Array.from({length:7}, (_,i) => addDays(weekStart(anchor), i)));
}

function renderTimetable(days){
  const label = document.getElementById('range-label');
  if (days.length === 1) {
    const d = days[0];
    label.textContent = `${DAYS_LONG[dowMon(d)]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
  } else {
    const a = days[0], b = days[6];
    label.textContent = `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]} ${b.getFullYear()}`;
  }

  const keys = days.map(ymd);
  const inRange = bookings.filter(b => keys.includes(b.date));
  let first = 8, last = 21;
  inRange.forEach(b => { const h = parseInt(b.time.slice(0,2),10); first = Math.min(first,h); last = Math.max(last,h); });

  const todayKey = ymd(new Date());
  const colMin = days.length === 1 ? 200 : 118;
  let html = `<div class="grid-wrap"><div class="tgrid" style="grid-template-columns:56px repeat(${days.length}, minmax(${colMin}px, 1fr)); min-width:${56 + days.length*colMin}px">`;
  html += '<div class="th corner"></div>';
  days.forEach(d => {
    html += `<div class="th${ymd(d)===todayKey?' today':''}">${DAYS_SHORT[dowMon(d)]}<small>${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</small></div>`;
  });
  for (let h = first; h <= last; h++) {
    html += `<div class="hr">${pad(h)}:00</div>`;
    days.forEach(d => {
      const key = ymd(d);
      const items = inRange
        .filter(b => b.date === key && parseInt(b.time.slice(0,2),10) === h)
        .sort((a,b) => a.time.localeCompare(b.time));
      html += `<div class="cell${dowMon(d)>=5?' weekend':''}" data-date="${key}" data-hour="${h}">` +
        items.map(b => `<button class="appt" data-id="${b.id}"><b>${b.time} ${escapeHtml(b.name)}</b><span>${escapeHtml(b.phone)}${b.reason ? ' · ' + escapeHtml(b.reason) : ''}</span></button>`).join('') +
        '</div>';
    });
  }
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;
}

function renderMonth(){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  document.getElementById('range-label').textContent = `${MONTHS[m]} ${y}`;
  const counts = {};
  bookings.forEach(b => { counts[b.date] = (counts[b.date]||0) + 1; });
  const todayKey = ymd(new Date());
  const offset = dowMon(new Date(y, m, 1));
  const dim = new Date(y, m+1, 0).getDate();
  let html = '<div class="cal-wrap"><div class="cal-grid2">' + ['Δ','Τ','Τ','Π','Π','Σ','Κ'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < offset; i++) html += '<div class="day"></div>';
  for (let d = 1; d <= dim; d++) {
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const n = counts[key] || 0;
    html += `<div class="day in${n?' has':''}${key===todayKey?' today':''}" data-date="${key}">${d}${n ? `<span class="badge">${n} ραντ.</span>` : ''}</div>`;
  }
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;
}

// ---------- navigation ----------
document.getElementById('mode-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; render();
});
function step(dir){
  if (mode === 'day') anchor = addDays(anchor, dir);
  else if (mode === 'week') anchor = addDays(anchor, 7*dir);
  else anchor = new Date(anchor.getFullYear(), anchor.getMonth()+dir, 1);
  render();
}
document.getElementById('prev-btn').addEventListener('click', () => step(-1));
document.getElementById('next-btn').addEventListener('click', () => step(1));
document.getElementById('today-btn').addEventListener('click', () => { anchor = new Date(); anchor.setHours(0,0,0,0); render(); });

document.getElementById('view').addEventListener('click', e => {
  const appt = e.target.closest('.appt');
  if (appt) { openModal(bookings.find(b => b.id === appt.dataset.id)); return; }
  const cell = e.target.closest('.cell');
  if (cell) { openModal(null, cell.dataset.date, pad(cell.dataset.hour) + ':00'); return; }
  const day = e.target.closest('.day.in');
  if (day) { anchor = parseYmd(day.dataset.date); mode = 'day'; render(); }
});
document.getElementById('new-btn').addEventListener('click', () => openModal(null, ymd(mode==='month'?new Date():anchor), ''));

// ---------- modal ----------
const modal = document.getElementById('modal');
function openModal(b, date, time){
  editing = b;
  document.getElementById('modal-title').textContent = b ? 'Επεξεργασία ραντεβού' : 'Νέο ραντεβού';
  document.getElementById('f-date').value = b ? b.date : (date || '');
  document.getElementById('f-time').value = b ? b.time : (time || '');
  document.getElementById('f-name').value = b ? b.name : '';
  document.getElementById('f-phone').value = b ? b.phone : '';
  document.getElementById('f-reason').value = b ? b.reason : '';
  document.getElementById('delete-btn').style.display = b ? '' : 'none';
  setMsg('');
  modal.style.display = 'flex';
}
function closeModal(){ modal.style.display = 'none'; editing = null; }
function setMsg(t){ const el = document.getElementById('modal-msg'); el.textContent = t; el.className = t ? 'err' : ''; }
document.getElementById('close-btn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

// ---------- slot helpers ----------
// Normal bookable slots: Mon–Fri, on the hour, 09:00–20:00. Anything else is a one-off slot created by hand.
function isRegularSlot(date, time){
  const d = parseYmd(date);
  const [h, m] = time.split(':').map(Number);
  return dowMon(d) < 5 && m === 0 && h >= 9 && h <= 20;
}
// Returns a slot id that is now marked booked, or null if someone else already holds that time.
async function claimSlot(date, time, keepSlotId){
  const { data: existing } = await supa.from('availability').select('id, is_booked')
    .eq('slot_date', date).eq('slot_time', time + ':00').maybeSingle();
  if (existing) {
    if (existing.id === keepSlotId) return existing.id;
    if (existing.is_booked) return null;
    const { data: upd, error } = await supa.from('availability').update({ is_booked: true })
      .eq('id', existing.id).eq('is_booked', false).select();
    if (error) throw error;
    return upd && upd.length ? existing.id : null;
  }
  const { data: created, error } = await supa.from('availability')
    .insert({ slot_date: date, slot_time: time + ':00', is_booked: true }).select().single();
  if (error) throw error;
  return created.id;
}
// Frees a slot after a cancel/move. Regular slots become bookable again; one-off slots are removed
// so they never show up as public availability.
async function releaseSlot(slotId, date, time){
  if (isRegularSlot(date, time)) await supa.from('availability').update({ is_booked: false }).eq('id', slotId);
  else await supa.from('availability').delete().eq('id', slotId);
}

function sendSms(phone, name, date, time){
  const d = parseYmd(date);
  const text = `Γεια σου ${name}, το ραντεβού σου στο SportsRehub επιβεβαιώθηκε για ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} στις ${time}. Θερμοπύλων 1, Άγιος Νικόλαος. Τηλ: 2841089303`;
  supa.functions.invoke('send-sms', { body: { phone, message: text } }).catch(err => console.error('SMS send failed:', err));
}

// ---------- save / cancel ----------
document.getElementById('appt-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const reason = document.getElementById('f-reason').value.trim();
  if (!date || !time || !name || !phone) { setMsg('Συμπλήρωσε ημερομηνία, ώρα, όνομα και τηλέφωνο.'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Αποθήκευση…'; setMsg('');
  try {
    if (!editing) {
      const slotId = await claimSlot(date, time, null);
      if (!slotId) { setMsg('Αυτή η ώρα είναι ήδη κλεισμένη.'); return; }
      const { error } = await supa.from('bookings').insert({ slot_id: slotId, full_name: name, phone, reason, language: 'el' });
      if (error) throw error;
      sendSms(phone, name, date, time);
    } else {
      const moved = date !== editing.date || time !== editing.time;
      let slotId = editing.slotId;
      if (moved) {
        slotId = await claimSlot(date, time, editing.slotId);
        if (!slotId) { setMsg('Αυτή η ώρα είναι ήδη κλεισμένη.'); return; }
      }
      const { error } = await supa.from('bookings').update({ slot_id: slotId, full_name: name, phone, reason }).eq('id', editing.id);
      if (error) throw error;
      if (moved) {
        await releaseSlot(editing.slotId, editing.date, editing.time);
        if (confirm('Η ημερομηνία/ώρα άλλαξε. Να σταλεί SMS ενημέρωσης στον ασθενή;')) sendSms(phone, name, date, time);
      }
    }
    closeModal();
    anchor = parseYmd(date);
    await loadBookings();
  } catch (err) {
    console.error(err);
    setMsg('Κάτι πήγε στραβά. Δοκίμασε ξανά.');
  } finally {
    btn.disabled = false; btn.textContent = 'Αποθήκευση';
  }
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!editing) return;
  if (!confirm('Σίγουρα θέλεις να ακυρώσεις αυτό το ραντεβού; Η ώρα θα ξαναγίνει διαθέσιμη.')) return;
  const b = editing;
  const { error } = await supa.from('bookings').delete().eq('id', b.id);
  if (error) { console.error(error); setMsg('Σφάλμα κατά την ακύρωση.'); return; }
  await releaseSlot(b.slotId, b.date, b.time);
  closeModal();
  await loadBookings();
});

checkSession();
</script>
</body>
</html>
